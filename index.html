<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1 Practice &amp; Tests</title>
<style>
:root{
  --bg:#0f1117; --bg2:#141722; --card:#191d29; --card2:#202634; --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.14);
  --text:#edeff5; --muted:#98a2b6; --dim:#646e84;
  --accent:#ff5f52; --accent2:#ff8a70; --accent-grad:linear-gradient(135deg,#ff7059 0%,#e8365d 100%);
  --accent-soft:rgba(255,95,82,.13);
  --ok:#3ddc84; --ok-soft:rgba(61,220,132,.12); --bad:#ff5f52; --bad-soft:rgba(255,95,82,.12);
  --warn:#ffc24d; --warn-soft:rgba(255,194,77,.12);
  --cat-vocab:#54c7fb; --cat-sentence:#a8d968; --cat-listen:#d29cf5; --cat-exam:#ffb65c; --cat-match:#3fd6b0;
  --radius:16px; --radius-s:10px;
  --shadow:0 10px 34px rgba(0,0,0,.42);
  --inset:inset 0 1px 0 rgba(255,255,255,.045);
  --hanzi:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html[data-theme="light"]{
  --bg:#eef0f6; --bg2:#e5e8f0; --card:#ffffff; --card2:#f4f6fa; --line:rgba(16,24,48,.10); --line2:rgba(16,24,48,.18);
  --text:#171d2b; --muted:#59627a; --dim:#8b93a8;
  --accent-soft:rgba(232,54,93,.08);
  --shadow:0 10px 26px rgba(20,28,55,.10);
  --inset:inset 0 1px 0 rgba(255,255,255,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(600px 340px at 85% -80px,rgba(255,95,82,.10),transparent 65%),
    radial-gradient(700px 400px at -10% 30%,rgba(84,199,251,.06),transparent 60%),
    radial-gradient(500px 300px at 60% 110%,rgba(210,156,245,.05),transparent 60%)}
html[data-theme="light"] body::before{background:
    radial-gradient(600px 340px at 85% -80px,rgba(232,54,93,.07),transparent 65%),
    radial-gradient(700px 400px at -10% 30%,rgba(84,160,251,.05),transparent 60%)}
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}
.hanzi{font-family:var(--hanzi)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:var(--radius-s);padding:10px 13px;outline:none;transition:border .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
a{color:var(--accent2);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}

/* ===== Layout ===== */
header.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:11px 20px;
  background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);box-shadow:0 4px 24px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;white-space:nowrap;letter-spacing:-.2px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;font-family:var(--hanzi);box-shadow:0 4px 14px rgba(232,54,93,.4),var(--inset)}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--muted);letter-spacing:.5px}
.topbar .spacer{flex:1}
.topctl{display:flex;align-items:center;gap:8px}
.iconbtn{background:var(--card);border:1px solid var(--line2);color:var(--muted);width:39px;height:39px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;position:relative;transition:.18s;box-shadow:var(--inset)}
.iconbtn:hover{color:var(--text);border-color:var(--dim);transform:translateY(-1px)}
.iconbtn.on{color:#fff;border-color:transparent;background:var(--accent-grad);box-shadow:0 4px 12px rgba(232,54,93,.35)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--accent-grad);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 8px rgba(232,54,93,.5)}
.avatar{width:39px;height:39px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;border:2px solid var(--line2);cursor:pointer;transition:.18s;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.avatar:hover{transform:translateY(-1px);border-color:var(--accent)}
.main{display:flex;flex:1;min-height:0}
nav.side{width:224px;flex-shrink:0;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--bg2) 60%,transparent)}
nav.side .navitem{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;color:var(--muted);font-size:14px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:.16s;position:relative}
nav.side .navitem:hover{background:var(--card);color:var(--text);transform:translateX(2px)}
nav.side .navitem.active{background:var(--accent-soft);color:var(--accent2);font-weight:600}
nav.side .navitem.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-grad)}
nav.side .navitem .ni{width:20px;text-align:center;font-size:15px}
nav.side .sep{height:1px;background:var(--line);margin:12px 6px}
nav.side .count{margin-left:auto;background:var(--accent-grad);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 7px;box-shadow:0 2px 6px rgba(232,54,93,.4)}
main.content{flex:1;padding:26px 30px 60px;max-width:1200px;width:100%;margin:0 auto;min-width:0}
@media(max-width:900px){
  nav.side{position:fixed;left:0;top:0;bottom:0;z-index:80;background:var(--bg2);transform:translateX(-105%);transition:.25s;box-shadow:var(--shadow)}
  nav.side.open{transform:none}
  .navbackdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;backdrop-filter:blur(2px)}
  main.content{padding:18px 15px 70px}
  .mobmenubtn{display:inline-flex!important}
}
.mobmenubtn{display:none}

/* ===== Components ===== */
h1.page{font-size:24px;margin-bottom:5px;letter-spacing:-.4px;font-weight:800}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff 8%),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--inset),0 4px 18px rgba(0,0,0,.16)}
html[data-theme="light"] .card{background:var(--card)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.g4,.g3,.g2{grid-template-columns:1fr}}
.grid>*{animation:fadeup .4s cubic-bezier(.22,1,.36,1) backwards}
.grid>*:nth-child(2){animation-delay:.04s}.grid>*:nth-child(3){animation-delay:.08s}
.grid>*:nth-child(4){animation-delay:.12s}.grid>*:nth-child(5){animation-delay:.16s}
.grid>*:nth-child(6){animation-delay:.2s}.grid>*:nth-child(n+7){animation-delay:.24s}
@keyframes fadeup{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 19px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--text);font-weight:600;font-size:14px;transition:.16s;box-shadow:var(--inset)}
.btn:hover{border-color:var(--dim);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--accent-grad);border-color:transparent;color:#fff;box-shadow:0 5px 16px rgba(232,54,93,.38)}
.btn.primary:hover{box-shadow:0 7px 22px rgba(232,54,93,.5);filter:brightness(1.06)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:6px 13px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#3ddc84,#1fa860);border-color:transparent;color:#04240f;box-shadow:0 5px 16px rgba(61,220,132,.3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid;letter-spacing:.3px}
.chip.pending{color:var(--dim);border-color:var(--line2);background:var(--bg2)}
.chip.ready{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.chip.review{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.chip.progress{color:var(--cat-vocab);border-color:color-mix(in srgb,var(--cat-vocab) 45%,transparent);background:rgba(84,199,251,.1)}
.chip.done{color:var(--accent2);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.chip.fixture{color:var(--cat-match);border-color:color-mix(in srgb,var(--cat-match) 45%,transparent);background:rgba(63,214,176,.1)}
.progress{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:var(--accent-grad);border-radius:5px;transition:width .5s cubic-bezier(.22,1,.36,1);box-shadow:0 0 8px rgba(232,54,93,.45)}
.stat{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff 8%),var(--card));border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;position:relative;overflow:hidden;box-shadow:var(--inset),0 4px 18px rgba(0,0,0,.16);transition:.18s}
html[data-theme="light"] .stat{background:var(--card)}
.stat:hover{transform:translateY(-2px);border-color:var(--line2)}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.8px}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:3px;font-weight:600}
.stat .d{font-size:12px;color:var(--dim);margin-top:4px}
.stat .sic{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--accent-soft);color:var(--accent2)}
.empty{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:50px 26px;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--card) 45%,transparent)}
.empty .big{font-size:40px;margin-bottom:12px;display:inline-flex;width:84px;height:84px;border-radius:50%;align-items:center;justify-content:center;background:var(--accent-soft);box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 5%,transparent)}
.empty h3{color:var(--text);margin-bottom:7px;font-size:17.5px}
.empty p{font-size:13.5px;max-width:480px;margin:0 auto}
.notice{border-radius:var(--radius-s);padding:13px 16px;font-size:13.5px;margin-bottom:16px;border:1px solid;backdrop-filter:blur(4px)}
.notice.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)}
.notice.info{background:rgba(84,199,251,.08);border-color:color-mix(in srgb,var(--cat-vocab) 40%,transparent);color:var(--cat-vocab)}
.notice.err{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent);color:#ff9a92}
.notice.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
html[data-theme="light"] .notice.err{color:#c23232}

/* chapter card */
.chcard{background:linear-gradient(165deg,color-mix(in srgb,var(--card) 88%,#fff 12%),var(--card) 55%);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:10px;transition:.2s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;box-shadow:var(--inset),0 4px 18px rgba(0,0,0,.16)}
html[data-theme="light"] .chcard{background:var(--card)}
.chcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-grad);opacity:.75}
.chcard:hover{transform:translateY(-4px);box-shadow:var(--shadow),0 0 0 1px var(--line2);border-color:var(--line2)}
.chcard .num{position:absolute;right:-10px;top:-24px;font-size:86px;font-weight:800;color:var(--text);opacity:.05;z-index:0;letter-spacing:-4px}
.chcard h3{font-size:16.5px;position:relative;letter-spacing:-.2px}
.chcard .meta{font-size:12.5px;color:var(--muted);position:relative}
.excard{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff 8%),var(--card));border:1px solid var(--line);border-left:4px solid var(--cat);border-radius:var(--radius);padding:17px;cursor:pointer;transition:.18s cubic-bezier(.22,1,.36,1);text-align:left;width:100%;color:var(--text);box-shadow:var(--inset),0 3px 14px rgba(0,0,0,.14);position:relative;overflow:hidden}
html[data-theme="light"] .excard{background:var(--card)}
.excard::after{content:"";position:absolute;inset:0;background:radial-gradient(240px 80px at 0% 0%,color-mix(in srgb,var(--cat) 10%,transparent),transparent 70%);opacity:0;transition:.25s;pointer-events:none}
.excard:hover{transform:translateY(-3px);box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--cat) 30%,transparent)}
.excard:hover::after{opacity:1}
.excard:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none}
.excard .t{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:10px;position:relative}
.excard .t>span:first-child{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;background:color-mix(in srgb,var(--cat) 15%,transparent);color:var(--cat);flex-shrink:0;font-family:var(--hanzi)}
.excard .d{font-size:12.5px;color:var(--muted);margin-top:7px;position:relative}
.excard .foot{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12px;color:var(--dim);position:relative}

/* exercise runner */
.runner{max-width:720px;margin:0 auto;animation:fadeup .3s cubic-bezier(.22,1,.36,1)}
.rtop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rtop .progress{flex:1}
.qcard{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 90%,#fff 10%),var(--card));border:1px solid var(--line);border-radius:18px;padding:18px 20px 20px;text-align:center;box-shadow:var(--inset),var(--shadow);position:relative;overflow:hidden}
html[data-theme="light"] .qcard{background:var(--card)}
.qcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent-grad);opacity:.8}
.qprompt{font-size:18px;margin-bottom:4px;font-weight:600;letter-spacing:-.2px}
.qprompt.big{font-size:38px;font-weight:600;font-family:var(--hanzi);letter-spacing:1px;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.qpinyin{color:var(--cat-vocab);font-size:14.5px;margin-bottom:3px;font-weight:500}
.qen{color:var(--muted);font-size:13px}
.opts{display:grid;gap:8px;margin-top:14px}
.opts.two{grid-template-columns:1fr 1fr}
@media(max-width:620px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:11px;background:var(--card2);border:1.5px solid var(--line2);border-radius:11px;padding:9px 13px;font-size:14px;text-align:left;color:var(--text);transition:.14s;width:100%;box-shadow:var(--inset)}
.opt:hover:not(:disabled){border-color:var(--dim);transform:translateX(3px)}
.opt .key{width:24px;height:24px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted);flex-shrink:0;transition:.14s}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.opt.sel .key{background:var(--accent-grad);color:#fff;border-color:transparent}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.correct .key{background:linear-gradient(135deg,#3ddc84,#1fa860);color:#04240f;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .key{background:var(--accent-grad);color:#fff;border-color:transparent}
.opt:disabled{cursor:default;transform:none!important}
.opt .hanzi{font-size:17px}
.opt .py{font-size:12px;color:var(--cat-vocab)}
.fb{margin-top:12px;border-radius:11px;padding:11px 14px;font-size:13px;text-align:left;border:1px solid;animation:fadeup .3s}
.fb.good{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.fb.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.fb .ttl{font-weight:800;margin-bottom:5px;font-size:15px}
.timerbar{height:5px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-bottom:10px;border:1px solid var(--line)}
.timerbar>div{height:100%;background:linear-gradient(90deg,#ffc24d,#ff9f43);transition:width 1s linear}
.timerbar>div.low{background:var(--accent-grad)}
.audiobtn{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);color:var(--accent);font-size:27px;display:inline-flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 6%,transparent),0 0 0 16px color-mix(in srgb,var(--accent) 3%,transparent)}
.audiobtn:hover{background:var(--accent-grad);color:#fff;border-color:transparent;transform:scale(1.05);box-shadow:0 6px 18px rgba(232,54,93,.45)}
.audiobtn.playing{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,95,82,.45)}50%{box-shadow:0 0 0 18px rgba(255,95,82,0)}}
.speedctl{display:inline-flex;gap:5px;margin-top:9px;background:var(--bg2);padding:4px;border-radius:10px;border:1px solid var(--line)}
.speedctl button{padding:5px 13px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;transition:.14s}
.speedctl button.on{background:var(--accent-grad);color:#fff;box-shadow:0 2px 8px rgba(232,54,93,.4)}

/* matching */
.mcol{display:grid;gap:9px}
.mtile{background:var(--card2);border:1.5px solid var(--line2);border-radius:12px;padding:13px;font-size:15px;text-align:center;color:var(--text);transition:.14s;box-shadow:var(--inset)}
.mtile:hover:not(:disabled){border-color:var(--dim);transform:translateY(-2px)}
.mtile.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);transform:translateY(-2px)}
.mtile.matched{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);opacity:.6;transform:scale(.97)}
.mtile.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* flashcards */
.fcard{perspective:1400px;height:340px;cursor:pointer}
.finner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d}
.fcard.flipped .finner{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:26px;text-align:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--card) 85%,#fff 15%),var(--card) 60%);border:1px solid var(--line2);box-shadow:var(--shadow),var(--inset);overflow:hidden}
html[data-theme="light"] .fface{background:var(--card)}
.fface::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent-grad)}
.fface.back::before{background:linear-gradient(90deg,var(--cat-vocab),var(--cat-match))}
.fface.back{transform:rotateY(180deg)}

/* builder */
.tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;min-height:58px;padding:13px;background:var(--bg2);border:1.5px dashed var(--line2);border-radius:14px}
.tile{background:linear-gradient(180deg,var(--card2),color-mix(in srgb,var(--card2) 85%,#000 15%));border:1.5px solid var(--line2);border-radius:11px;padding:10px 17px;font-size:18px;font-family:var(--hanzi);color:var(--text);transition:.13s;user-select:none;box-shadow:0 3px 10px rgba(0,0,0,.25),var(--inset)}

<body>
<div id="app"></div>
<script>
"use strict";
window.addEventListener("error",function(ev){
  try{var d=document.createElement("div");
  d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:999;background:#7a1020;color:#fff;padding:10px 16px;font:12px ui-monospace,monospace;white-space:pre-wrap";
  d.textContent="PAGE ERROR: "+(ev.message||"unknown")+" @ line "+(ev.lineno||"?")+" — copy this message to the developer";
  (document.body||document.documentElement).appendChild(d);}catch(e){}
});
/* =====================================================================
   HSK 1 Practice & Tests — Prototype Build (Phase 1–4 + engine)
   ---------------------------------------------------------------------
   PERSISTENCE NOTICE: This prototype stores all data in browser
   localStorage under per-user keys. It is NOT a secure multi-user
   database. Passwords are lightly obfuscated, NOT properly hashed.
   A backend (Supabase/PostgreSQL) migration path is documented in
   README.md. Data stays on this device only.
   CONTENT NOTICE: No curriculum content is invented by this app.
   Real chapters stay "Content Pending" until source material is
   imported via the Admin panel. The only playable content is the
   clearly-labeled Technical Test Fixture (non-curriculum).
   ===================================================================== */

/* @@CORE-START@@ (shared with admin.html — edit via index.html, then run tools/build_admin.py) */
/* ---------- tiny DOM helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(k==="class")e.className=v;
    else if(k==="html")e.innerHTML=v;
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v!==null&&v!==undefined&&v!==false)e.setAttribute(k,v);
  }
  for(const kid of kids.flat(9)){if(kid==null||kid===false)continue;
    e.appendChild(typeof kid==="object"?kid:document.createTextNode(String(kid)));}
  return e;}
/* animated SVG score ring */
function ring(pct,color,label,size){
  size=size||160;label=label||"score";
  const disp=pct==null?"—":pct+"%",val=pct==null?0:pct;
  const r=(size-16)/2,c=2*Math.PI*r,half=size/2;
  const wrap=h("div",{class:"rescircle",style:"width:"+size+"px;height:"+size+"px",
    html:`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${half}" cy="${half}" r="${r}" fill="none" stroke="rgba(128,140,165,.18)" stroke-width="10"/>
      <circle class="ringfill" cx="${half}" cy="${half}" r="${r}" fill="none" stroke="${color}" stroke-width="10"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}"
        transform="rotate(-90 ${half} ${half})" style="color:${color}"/>
    </svg><div class="ringlbl"><span class="pct" style="color:${color}">${disp}</span><span class="lbl">${label}</span></div>`});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const f=wrap.querySelector?wrap.querySelector(".ringfill"):null;
    if(f)f.style.strokeDashoffset=(c*(1-val/100)).toFixed(1);}));
  return wrap;
}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=ts=>ts?new Date(ts).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}):"—";
const fmtDur=sec=>{sec=Math.round(sec||0);if(sec<60)return sec+"s";const m=Math.floor(sec/60),s=sec%60;if(m<60)return m+"m "+(s?s+"s":"");const hh=Math.floor(m/60);return hh+"h "+(m%60)+"m";};

/* ---------- store ---------- */
const DB_KEY="hsk1_db_v1";
const defaultDB=()=>({
  schemaVersion:1,
  users:[],            // {id,name,pass,role,createdAt,color}
  sessionUserId:null,
  chapters:[],         // {id,num,title,status,sourceFile,importedAt,validation,representative:{hanzi,pinyin,english}}
  vocab:[],            // {id,chapterId,hanzi,pinyin,english,sourcePage,sourceItemId,pinyinVerified}
  sentences:[],        // {id,chapterId,hanzi,pinyin,english,segments,altOrders,sourcePage,sourceItemId}
  questions:[],        // generated question bank {id,chapterId,type,sourceItemId,...}
  attempts:[],         // {id,userId,chapterId,questionId,type,submitted,correct,skipped,ts,runId,ms}
  vocabProgress:{},    // userId -> wordId -> {correct,incorrect,days:{},state,selfKnown,lastTs}
  chapterProgress:{},  // userId -> chapterId -> {startedAt,completedActivities:{},lastPracticedAt}
  exams:[],            // {id,userId,chapterId,ts,score,total,timed,durationSec,responses}
  timeLog:[],          // {userId,date,seconds}
  settings:{},         // userId -> {pinyin,timed,theme,timePerQ,masteryCorrect,masteryDays}
});
let DB;
function loadDB(){try{DB=JSON.parse(localStorage.getItem(DB_KEY))||defaultDB();
  for(const k of Object.keys(defaultDB()))if(DB[k]===undefined)DB[k]=defaultDB()[k];
 }catch(e){console.warn("DB reset due to parse error",e);DB=defaultDB();}saveDB();}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(DB));}
loadDB();

const DEFAULT_SETTINGS={pinyin:true,timed:false,theme:"dark",timePerQ:30,masteryCorrect:3,masteryDays:2,sidebarCollapsed:false};
function me(){return DB.users.find(u=>u.id===DB.sessionUserId)||null;}
function mySettings(){const u=me();if(!u)return{...DEFAULT_SETTINGS};return{...DEFAULT_SETTINGS,...(DB.settings[u.id]||{})};}
function saveSettings(patch){const u=me();if(!u)return;DB.settings[u.id]={...mySettings(),...patch};saveDB();applyTheme();applyPinyinClass();}
function applyTheme(){document.documentElement.setAttribute("data-theme",mySettings().theme||"dark");}
function applyPinyinClass(){document.body.classList.toggle("pyoff",!mySettings().pinyin);}
function myAttempts(){const u=me();return u?DB.attempts.filter(a=>a.userId===u.id):[];}
function myExams(){const u=me();return u?DB.exams.filter(e=>e.userId===u.id):[];}

/* simple non-crypto obfuscation — PROTOTYPE ONLY, see notice above */
const obf=s=>{let x=5381;for(const c of String(s))x=((x<<5)+x+c.charCodeAt(0))>>>0;return "h"+x.toString(36);};
const userColor=id=>{const cs=["#ff5a52","#4fc3f7","#aed581","#ce93d8","#ffb74d","#4dd0b1","#f48fb1","#90a4ae"];
  let x=0;for(const c of id)x=(x*31+c.charCodeAt(0))>>>0;return cs[x%cs.length];};

/* ---------- auth ---------- */
function register(name,pass){
  name=(name||"").trim();
  if(name.length<2)return{err:"Display name must be at least 2 characters."};
  if((pass||"").length<4)return{err:"Password must be at least 4 characters."};
  if(DB.users.some(u=>u.name.toLowerCase()===name.toLowerCase()))return{err:"That display name is already taken on this device."};
  const u={id:uid("stu"),studentId:"HSK1-"+String(DB.users.length+1).padStart(4,"0"),
    name,pass:obf(pass),role:DB.users.length===0?"admin":"student", // first account on the device = site owner/admin
    createdAt:new Date().toISOString(),color:userColor(uid("c"))};
  DB.users.push(u);DB.sessionUserId=u.id;DB.settings[u.id]={...DEFAULT_SETTINGS};saveDB();applyTheme();
  return{ok:u};
}
function login(name,pass){
  const u=DB.users.find(u=>u.name.toLowerCase()===(name||"").trim().toLowerCase());
  if(!u||u.pass!==obf(pass))return{err:"Invalid name or password."};
  DB.sessionUserId=u.id;saveDB();applyTheme();return{ok:u};
}
function logout(){DB.sessionUserId=null;saveDB();location.hash="#/login";render();}
/* link/create a local profile for a student authenticated against the Google Sheet */
function linkSheetStudent(st){
  let u=DB.users.find(x=>x.sheetId===st.StudentID)||
        DB.users.find(x=>x.name.toLowerCase()===String(st.StudentName||"").toLowerCase());
  if(!u){u={id:uid("stu"),studentId:st.StudentID,name:st.StudentName,pass:obf("sheet::"+st.StudentID),
    role:"student",createdAt:new Date().toISOString(),color:userColor(uid("c"))};
    DB.users.push(u);DB.settings[u.id]={...DEFAULT_SETTINGS};}
  u.sheetId=st.StudentID;DB.sessionUserId=u.id;saveDB();applyTheme();applyPinyinClass();
  SYNC.logLogin({StudentID:st.StudentID,Method:"sheet",LocalID:u.id,OK:true});
  return u;
}

/* ---------- content accessors ---------- */
const chapterById=id=>DB.chapters.find(c=>c.id===id);
const vocabOf=ch=>DB.vocab.filter(v=>v.chapterId===ch);
const sentencesOf=ch=>DB.sentences.filter(s=>s.chapterId===ch);
const questionsOf=(ch,type)=>DB.questions.filter(q=>q.chapterId===ch&&(!type||q.type===type));
const isReady=ch=>["ready","review","in_progress","completed"].includes(ch.status);
function chapterStatus(ch){ // derived display status
  if(ch.isFixture)return"fixture";
  if(!isReady(ch))return ch.status; // pending | processing | review
  const u=me();const cp=u&&DB.chapterProgress[u.id]&&DB.chapterProgress[u.id][ch.id];
  if(!cp)return"ready";
  if(cp.completedAt)return"completed";
  return"in_progress";
}
const STATUS_LABEL={pending:"Content Pending",processing:"Processing",review:"Needs Review",ready:"Ready",in_progress:"In Progress",completed:"Completed",fixture:"Test Fixture"};

/* ---------- activity catalog (the 10 activities + exam) ---------- */
const ACT={
  vocab_c2e:{n:"Words: Chinese → English",cat:"vocab",icon:"汉",kind:"mcq",desc:"See a Chinese word, choose its English meaning."},
  vocab_e2c:{n:"Words: English → Chinese",cat:"vocab",icon:"EN",kind:"mcq",desc:"See an English meaning, choose the Chinese word."},
  matching :{n:"Word Matching",cat:"match",icon:"⇄",kind:"matching",desc:"Pair Chinese words with English meanings."},
  listening:{n:"Listening on Words",cat:"listen",icon:"🔊",kind:"mcq",desc:"Hear a word, choose its English meaning."},
  flashcards:{n:"Flashcards",cat:"vocab",icon:"▤",kind:"flash",desc:"Flip cards, mark Known / Needs Practice."},
  triple   :{n:"Triple Match Game",cat:"match",icon:"3",kind:"triple",desc:"Match hanzi + pinyin + English."},
  sent_e2c:{n:"Sentences: English → Chinese",cat:"sentence",icon:"译",kind:"mcq",desc:"Choose the correct Chinese sentence."},
  sent_c2e:{n:"Sentences: Chinese → English",cat:"sentence",icon:"EN",kind:"mcq",desc:"Choose the correct English translation."},
  cloze    :{n:"Complete the Sentence",cat:"sentence",icon:"＿",kind:"mcq",desc:"Fill the blank in a source sentence."},
  exam     :{n:"Chapter Exam",cat:"exam",icon:"★",kind:"exam",desc:"Mixed, graded, timed option, no reveals until the end."},
};
const CAT_COLOR={vocab:"var(--cat-vocab)",sentence:"var(--cat-sentence)",listen:"var(--cat-listen)",exam:"var(--cat-exam)",match:"var(--cat-match)"};

/* ---------- audio (Web Speech API — real TTS, graceful fallback) ---------- */
const Audio_={
  supported:(typeof window!=="undefined"&&!!window.speechSynthesis),
  zhVoice:null,
  init(){if(!this.supported)return;const pick=()=>{const vs=speechSynthesis.getVoices();
      this.zhVoice=vs.find(v=>/zh[-_]CN/i.test(v.lang)&&/female|xiaoxiao|huihui|yaoyao|ting/i.test(v.name))
                ||vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;};
    pick();speechSynthesis.onvoiceschanged=pick;},
  speak(text,rate=1){
    if(!this.supported||!speechSynthesis)return Promise.resolve({ok:false,reason:"unsupported"});
    return new Promise(res=>{
      try{speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);u.lang="zh-CN";u.rate=rate;
        if(this.zhVoice)u.voice=this.zhVoice;
        u.onend=()=>res({ok:true});u.onerror=e=>res({ok:false,reason:e.error||"error"});
        speechSynthesis.speak(u);
        setTimeout(()=>res({ok:false,reason:"timeout"}),Math.max(8000,text.length*600/rate));
      }catch(e){res({ok:false,reason:"exception"});}
    });},
  stop(){if(this.supported)speechSynthesis.cancel();}
};
Audio_.init();

/* ---------- attempt / progress recording (single source of truth) ---------- */
function recordAttempt({chapterId,questionId,type,submitted,correct,skipped,runId,ms}){
  const u=me();if(!u)return;
  DB.attempts.push({id:uid("att"),userId:u.id,chapterId,questionId,type,
    submitted:submitted??null,correct:!!correct,skipped:!!skipped,
    ts:new Date().toISOString(),runId,ms:ms||0});
  // vocab mastery update for word-based questions
  const q=DB.questions.find(q=>q.id===questionId);
  if(q&&q.wordId)updateVocabProgress(q.wordId,correct,skipped);
  // chapter progress touch
  const cp=DB.chapterProgress[u.id]=DB.chapterProgress[u.id]||{};
  const c=cp[chapterId]=cp[chapterId]||{startedAt:new Date().toISOString(),activities:{}};
  c.lastPracticedAt=new Date().toISOString();
  c.activities[type]=c.activities[type]||{runs:0,correct:0,total:0};
  c.activities[type].runs++;c.activities[type].total++;if(correct)c.activities[type].correct++;
  saveDB();
  const sidA=sheetStudentId();
  if(sidA&&SYNC.enabled()){const qz=DB.questions.find(x=>x.id===questionId);
    SYNC.enqueue("attempt",{StudentID:sidA,Ts:new Date().toISOString(),LessonID:lessonIdOf(chapterId),
      QuestionID:qz?stableQid(qz):questionId,ActivityType:type,
      Submitted:submitted==null?"":String(submitted),Correct:correct?"true":"false",
      Skipped:skipped?"true":"false",Ms:ms||"",AttemptsDelta:1,CorrectDelta:correct?1:0});
    SYNC.schedule();}
}
function updateVocabProgress(wordId,correct,skipped){
  const u=me();if(!u||skipped)return;
  const vp=DB.vocabProgress[u.id]=DB.vocabProgress[u.id]||{};
  const w=vp[wordId]=vp[wordId]||{correct:0,incorrect:0,days:{},state:"learning",selfKnown:null,lastTs:null};
  const s=mySettings();
  if(correct){w.correct++;w.days[today()]=true;
    const distinct=Object.keys(w.days).length;
    w.state=(w.correct>=s.masteryCorrect&&distinct>=s.masteryDays)?"mastered":"learning";
  }else{w.incorrect++;w.state="needs_revision";}
  w.lastTs=new Date().toISOString();
  const sidV=sheetStudentId();
  if(sidV&&SYNC.enabled()){const wi=DB.vocab.find(v=>v.id===wordId);
    if(wi)SYNC.enqueue("vocab",{StudentID:sidV,LessonID:lessonIdOf(wi.chapterId),
      WordID:wi.sourceItemId||wi.id,Hanzi:wi.hanzi,Correct:w.correct,Incorrect:w.incorrect,
      State:w.state,SelfKnown:w.selfKnown===true?"true":w.selfKnown===false?"false":"",
      Days:Object.keys(w.days||{}).length,LastTs:w.lastTs||""});}
}
function logTime(seconds){const u=me();if(!u||seconds<2)return;
  const d=today();const e=DB.timeLog.find(t=>t.userId===u.id&&t.date===d);
  if(e)e.seconds+=seconds;else DB.timeLog.push({userId:u.id,date:d,seconds});saveDB();}
function totalPracticeSeconds(){const u=me();if(!u)return 0;
  return DB.timeLog.filter(t=>t.userId===u.id).reduce((a,t)=>a+t.seconds,0);}

/* ---------- stats ---------- */
function overallStats(){
  const att=myAttempts().filter(a=>!a.skipped);
  const correct=att.filter(a=>a.correct).length;
  const uq=new Set(att.map(a=>a.questionId));
  const uqWrong=new Set(att.filter(a=>!a.correct).map(a=>a.questionId));
  const u=me();
  const chReady=DB.chapters.filter(isReady);
  const cp=u?(DB.chapterProgress[u.id]||{}):{};
  const started=chReady.filter(c=>cp[c.id]).length;
  const completed=chReady.filter(c=>cp[c.id]&&cp[c.id].completedAt).length;
  const allWords=DB.vocab.filter(v=>isReady(chapterById(v.chapterId)));
  const vp=u?(DB.vocabProgress[u.id]||{}):{};
  const practiced=allWords.filter(w=>vp[w.id]&&(vp[w.id].correct+vp[w.id].incorrect)>0);
  const mastered=allWords.filter(w=>vp[w.id]&&vp[w.id].state==="mastered");
  return{totalAttempts:att.length,correct,incorrect:att.length-correct,

    wordsTotal:allWords.length,wordsPracticed:practiced.length,wordsMastered:mastered.length,
    timeSec:totalPracticeSeconds(),sessions:new Set(att.map(a=>a.runId)).size,
    exams:myExams().length};

/* Instructor-set cap (2026-10-21): at most 15 cloze questions per chapter,
   spread round-robin over distinct source sentences for wider coverage. */
const CLOZE_PER_CHAPTER=15;

/* =====================================================================
   QUESTION ENGINE — generation from verified source items only
   ===================================================================== */
/* Distractor policy (§16): only same-chapter source items, or controlled
   variations of source sentences. If 3 distractors can't be produced,
   the question is flagged validation:"review". */

/* pick up to 3 distractors whose key field differs from the correct item
   AND from each other (prevents e.g. two "Sunday" options) */
function distinctDistractors(words,w,key,poolArg){
  const base=poolArg||words;
  const pool=shuffle(base.filter(x=>x.id!==w.id&&x[key]!==w[key]));
  const seen=new Set([w[key]]),out=[];
  for(const x of pool){if(seen.has(x[key]))continue;seen.add(x[key]);out.push(x);if(out.length===3)break;}
  return out;
}
function genQuestionsForChapter(chId){
  const before=DB.questions.filter(q=>q.chapterId===chId).length;
  DB.questions=DB.questions.filter(q=>q.chapterId!==chId); // regenerate (content versions: old bank replaced)
  const words=vocabOf(chId),sents=sentencesOf(chId);
  const report={generated:0,flagged:0,byType:{}};
  const add=q=>{q.id=q.id||uid("q");q.chapterId=chId;DB.questions.push(q);
    report.generated++;report.byType[q.type]=(report.byType[q.type]||0)+1;
    if(q.validation==="review")report.flagged++;};

  /* --- vocab_c2e : one per word (full coverage) --- */
  const hanziCount={};words.forEach(w=>hanziCount[w.hanzi]=(hanziCount[w.hanzi]||0)+1);
  for(const w of words){
    const twins=words.filter(x=>x.hanzi===w.hanzi);
    const ambiguous=twins.length>1; // same hanzi, different source meanings (天 weather/day)
    // Instructor decision (2026-10-21): KEEP both senses; ambiguity is resolved on-screen
    // by showing the source part-of-speech tag with the prompt (posHint), so the
    // question stays defensible and the twin's other meaning becomes a valid distractor.
    const posDisamb=ambiguous&&new Set(twins.map(t=>t.pos||"")).size===twins.length;
    const distract=distinctDistractors(words,w,"english");
    const validation=(distract.length===3&&(!ambiguous||posDisamb))?"validated":"review";
    add({type:"vocab_c2e",wordId:w.id,sourceItemId:w.sourceItemId||w.id,validation,
      posHint:posDisamb?(w.pos||null):null,
      hanzi:w.hanzi,pinyin:w.pinyin,
      options:[{text:w.english,correct:true},...distract.map(d=>({text:d.english,correct:false}))],
      explanation:`${w.hanzi}${w.pinyin?" ("+w.pinyin+")":""} = ${w.english}`});
  }
  /* --- vocab_e2c : one per word --- */
  for(const w of words){
    const distract=distinctDistractors(words,w,"hanzi");
    add({type:"vocab_e2c",wordId:w.id,sourceItemId:w.sourceItemId||w.id,
      validation:distract.length===3?"validated":"review",
      english:w.english,
      options:[{hanzi:w.hanzi,pinyin:w.pinyin,correct:true},...distract.map(d=>({hanzi:d.hanzi,pinyin:d.pinyin,correct:false}))],
      explanation:`${w.english} = ${w.hanzi}${w.pinyin?" ("+w.pinyin+")":""}`});
  }
  /* --- listening : one per word --- */
  for(const w of words){
    const twinsL=words.filter(x=>x.hanzi===w.hanzi);
    const ambL=twinsL.length>1;
    const posDisambL=ambL&&new Set(twinsL.map(t=>t.pos||"")).size===twinsL.length;
    const distract=distinctDistractors(words,w,"english");
    add({type:"listening",wordId:w.id,sourceItemId:w.sourceItemId||w.id,
      posHint:posDisambL?(w.pos||null):null,
      validation:(distract.length===3&&(!ambL||posDisambL))?"validated":"review",
      audioText:w.hanzi,hanzi:w.hanzi,pinyin:w.pinyin,
      options:[{text:w.english,correct:true},...distract.map(d=>({text:d.english,correct:false}))],
      explanation:`Audio: ${w.hanzi} (${w.pinyin||"pinyin unverified"}) = ${w.english}`});
  }
  /* --- cloze plan: ≤ CLOZE_PER_CHAPTER blanks, round-robin across sentences --- */
  const CLOZE_PUNCT=/^[，。！？、；：,.!?…—+＋-]$/;
  const clozePlan=new Map();
  {
    const order=shuffle(sents.filter(x=>x.segments&&x.segments.length>=2));
    let remaining=CLOZE_PER_CHAPTER;
    for(let pass=0;pass<3&&remaining>0;pass++){
      for(const x of order){
        if(remaining<=0)break;
        const used=clozePlan.get(x.id)||[];
        const cands=shuffle(x.segments.map((seg,i)=>[seg,i])
          .filter(([seg,i])=>seg&&!CLOZE_PUNCT.test(seg)&&!used.includes(i))
          .map(([,i])=>i));
        if(cands.length){used.push(cands[0]);clozePlan.set(x.id,used);remaining--;}
      }
    }
  }
  /* --- sent_e2c / sent_c2e / builder : ONLY for sentences that carry a
         source-supplied translation. Sentences without translation stay
         available for cloze / distractors / flashcards and are reported
         as a coverage shortfall (never auto-translated). --- */
  for(const s of sents){
    const others=shuffle(sents.filter(x=>x.id!==s.id&&x.hanzi!==s.hanzi));
    if(s.english){
      let distractorSents=others.slice(0,3);
      const controlled=[];
      if(distractorSents.length<3&&s.segments&&s.segments.length>=3){
        for(let i=0;i<s.segments.length-1&&controlled.length<3-distractorSents.length;i++){
          const seg=[...s.segments];[seg[i],seg[i+1]]=[seg[i+1],seg[i]];
          const v=seg.join("");
          if(v!==s.hanzi&&!controlled.includes(v))controlled.push(v);
        }
      }
      const dSet=[...distractorSents.map(x=>({hanzi:x.hanzi,pinyin:x.pinyin})),
                  ...controlled.map(hz=>({hanzi:hz,pinyin:null,pinyinUnverified:true}))].slice(0,3);
      add({type:"sent_e2c",sentenceId:s.id,sourceItemId:s.sourceItemId||s.id,
        validation:dSet.length===3?"validated":"review",
        english:s.english,
        options:[{hanzi:s.hanzi,pinyin:s.pinyin,correct:true},...dSet.map(d=>({...d,correct:false}))],
        explanation:"Source sentence: "+s.hanzi+" — "+s.english});
      let dEn=[...new Set(others.filter(x=>x.english).map(x=>x.english))].filter(x=>x&&x!==s.english).slice(0,3);
      add({type:"sent_c2e",sentenceId:s.id,sourceItemId:s.sourceItemId||s.id,
        validation:dEn.length===3?"validated":"review",
        hanzi:s.hanzi,pinyin:s.pinyin,
        options:[{text:s.english,correct:true},...dEn.map(t=>({text:t,correct:false}))],
        explanation:s.hanzi+" = "+s.english});
    }
    /* --- cloze: only the planned blanks for this sentence (cap enforced) --- */
    if(s.segments&&s.segments.length>=2){
      const pool=[...new Set([...s.segments,...words.map(w=>w.hanzi)])];
      const blankIdx=clozePlan.get(s.id)||[];
      for(const bi of blankIdx){
        const answer=s.segments[bi];
        const distract=shuffle(pool.filter(x=>x!==answer)).slice(0,3);
        add({type:"cloze",sentenceId:s.id,sourceItemId:s.sourceItemId||s.id,
          validation:distract.length===3?"validated":"review",
          hanzi:s.hanzi,pinyin:s.pinyin,blankIndex:bi,segments:s.segments,
          wordId:words.find(w=>w.hanzi===answer)?.id||null,
          options:[{hanzi:answer,correct:true},...distract.map(t=>({hanzi:t,correct:false}))],
          explanation:"Full source sentence: "+s.hanzi+(s.english?" — "+s.english:"")+(distract.length<3?" (insufficient distractors — flagged)":"")});
      }
    }
  }
  saveDB();
  return report;
}

/* ---------- validation (§16 checks) ---------- */
function validateChapter(chId){
  const issues=[],warn=[];
  const words=vocabOf(chId),sents=sentencesOf(chId),qs=questionsOf(chId);
  if(!words.length)issues.push("No vocabulary items.");
  for(const w of words){
    if(!w.hanzi||!w.english)issues.push(`Word ${w.id} missing hanzi/english.`);
    if(!w.pinyin)warn.push(`Word "${w.hanzi}" has no pinyin — flagged, not invented.`);
    if(w.pinyin&&!w.pinyinVerified)warn.push(`Pinyin for "${w.hanzi}" not marked verified.`);
  }
  for(const s of sents){
    if(!s.hanzi)issues.push(`Sentence ${s.id} missing hanzi.`);
    if(!s.english)warn.push(`Sentence "${s.hanzi}" has no translation in source — excluded from translation-based activities (translation NOT invented).`);
    if(!s.pinyin)warn.push(`Sentence "${s.hanzi}" has no pinyin in source — pinyin hidden/flagged, not invented.`);
    if(!s.segments||s.segments.length<2)warn.push(`Sentence "${s.hanzi}" not segmented — builder/cloze unavailable for it.`);
  }
  for(const q of qs){
    if(ACT[q.type]&&ACT[q.type].kind==="mcq"||q.type==="cloze"){
      if(!q.options||q.options.filter(o=>o.correct).length!==1)issues.push(`Question ${q.id}: must have exactly one correct option.`);
      if(q.options&&new Set(q.options.map(o=>o.text||o.hanzi)).size!==q.options.length)issues.push(`Question ${q.id}: duplicate options.`);
      if(q.options&&q.options.length<4)warn.push(`Question ${q.id}: fewer than 4 options (source too small) — flagged for review.`);
    }
  }
  // coverage
  const covC2E=new Set(qs.filter(q=>q.type==="vocab_c2e").map(q=>q.wordId));
  if(words.some(w=>!covC2E.has(w.id)))issues.push("Vocabulary C2E coverage incomplete.");
  const flagged=qs.filter(q=>q.validation==="review").length;
  return{ok:issues.length===0,issues,warnings:warn,flagged,
    counts:{words:words.length,sentences:sents.length,questions:qs.length}};
}

/* ---------- chapter import (admin) : JSON payload -> content + questions ---------- */
function importChapterJSON(payload){
  // Expected shape documented in README.md
  const errors=[];
  if(!payload.chapter||!payload.chapter.title)errors.push("chapter.title required (from source material).");
  if(!Array.isArray(payload.vocab))errors.push("vocab[] required (may be empty only if source truly has none).");
  if(errors.length)return{ok:false,errors};
  const chId=uid("ch");
  const ch={id:chId,num:payload.chapter.num??(DB.chapters.filter(c=>!c.isFixture).length+1),
    title:payload.chapter.title,status:"processing",sourceFile:payload.chapter.sourceFile||"unknown",
    sourcePages:payload.chapter.sourcePages||null,importedAt:new Date().toISOString(),
    representative:payload.chapter.representative||null};
  DB.chapters.push(ch);
  (payload.vocab||[]).forEach((w,i)=>{
    if(!w.hanzi||!w.english){errors.push(`vocab[${i}] missing hanzi or english`);return;}
    DB.vocab.push({id:chId+"_w"+i,chapterId:chId,hanzi:w.hanzi,pinyin:w.pinyin||null,english:w.english,
      sourceItemId:w.sourceItemId||("W"+(i+1)),sourcePage:w.sourcePage||null,pinyinVerified:!!w.pinyinVerified,
      pos:w.pos||null});
  });
  (payload.sentences||[]).forEach((s,i)=>{
    // english is OPTIONAL for sentences: untranslated source sentences remain
    // valid for cloze/distractors/flashcards; translation-based activities
    // simply report a shortfall instead of inventing translations.
    if(!s.hanzi){errors.push(`sentences[${i}] missing hanzi`);return;}
    if(s.segments&&s.segments.join("")!==s.hanzi){errors.push(`sentences[${i}] segments.join("") must equal hanzi exactly`);return;}
    DB.sentences.push({id:chId+"_s"+i,chapterId:chId,hanzi:s.hanzi,pinyin:s.pinyin||null,english:s.english,
      segments:s.segments||null,altOrders:s.altOrders||[],sourceItemId:s.sourceItemId||("S"+(i+1)),sourcePage:s.sourcePage||null,
      pinyinProvenance:s.pinyinProvenance||null,dialogue:s.dialogue||null,note:s.note||null});
  });
  const gen=genQuestionsForChapter(chId);
  const val=validateChapter(chId);
  ch.validation={...val,gen};
  ch.status=val.ok?(val.flagged>0?"review":"ready"):"review";
  saveDB();
  return{ok:true,chapter:ch,gen,validation:val,errors};
}

function ensureCurriculumImported(){
  let n=0;
  for(const b of CURRICULUM_BUNDLE){
    const existing=DB.chapters.find(c=>c.bundleCode===b.bundleCode);
    if(existing&&(existing.bundleRev||1)>=(b.rev||1))continue;
    if(existing){ // outdated content revision → purge chapter content and re-import
      const id=existing.id;
      DB.chapters=DB.chapters.filter(c=>c.id!==id);
      DB.vocab=DB.vocab.filter(v=>v.chapterId!==id);
      DB.sentences=DB.sentences.filter(s=>s.chapterId!==id);
      DB.questions=DB.questions.filter(q=>q.chapterId!==id);
    }
    const r=importChapterJSON(b.payload);
    if(r.ok){const ch=r.chapter;ch.bundleCode=b.bundleCode;ch.bundleRev=b.rev||1;saveDB();n++;
      console.log("[curriculum] imported bundle "+b.bundleCode+" → status "+ch.status+
        " (words "+r.validation.counts.words+", sentences "+r.validation.counts.sentences+", questions "+r.gen.generated+", flagged "+r.gen.flagged+")");}
  }
  return n;
}

/* Deployment-wide bridge credentials BAKED INTO THE BUILD (owner-approved 2026-10-22): every student
   browser on any deployed domain (Vercel / GitHub Pages / local) can sign in via the school Sheet with
   zero per-device setup. The staff console (Sheets Sync card) may override these values per browser;
   saving empty values disables sync on that device only. Token is a light classroom gate, not security. */
const SYNC_DEFAULTS={
  url:"https://script.google.com/macros/s/AKfycbz71MNiMuOdrF2Cg9J23zkPl0iyfUrDxIUD4j3xPSEuhD0iT9gsyEqW6o9MLH0srGj7/exec",
  token:"85246"};
const SYNC={
  KEY:"hsk1_sync_cfg", QKEY:"hsk1_sync_queue", LKEY:"hsk1_sync_last",
  cfg(){try{const raw=localStorage.getItem(this.KEY);
      if(raw){const c=JSON.parse(raw);if(c&&typeof c==="object")return{url:String(c.url||""),token:String(c.token||"")};}}catch(e){}
    return{url:SYNC_DEFAULTS.url,token:SYNC_DEFAULTS.token};},
  save(c){localStorage.setItem(this.KEY,JSON.stringify({url:(c&&c.url)||"",token:(c&&c.token)||""}));},
  reset(){localStorage.removeItem(this.KEY);},
  usingDefault(){return !localStorage.getItem(this.KEY);},
  enabled(){const c=this.cfg();return !!(c.url&&c.token);},
  queue(){try{return JSON.parse(localStorage.getItem(this.QKEY))||[];}catch(e){return[];}},
  last(){try{return JSON.parse(localStorage.getItem(this.LKEY))||null;}catch(e){return null;}},
  setLast(o){localStorage.setItem(this.LKEY,JSON.stringify(o));},
  enqueue(kind,data){if(!this.enabled())return;const q=this.queue();q.push({kind,data});
    if(q.length>500)q.splice(0,q.length-500);
    localStorage.setItem(this.QKEY,JSON.stringify(q));this.schedule();},
  _t:null,
  schedule(){if(this._t||typeof setTimeout==="undefined")return;this._t=setTimeout(()=>{this._t=null;this.flush();},2000);},
  async post(action,payload){const c=this.cfg();
    const r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action,token:c.token,payload})});
    return await r.json();},
  async flush(){if(!this.enabled())return{ok:false,reason:"disabled"};
    const q=this.queue();if(!q.length)return{ok:true,sent:0};
    const payload={sessions:[],attempts:[],vocab:[],lessons:[],exams:[]};
    const BUCKET={attempt:"attempts",vocab:"vocab",session:"sessions",lesson:"lessons",exam:"exams"};
    q.forEach(m=>{const b=BUCKET[m.kind];if(b)payload[b].push(m.data);});
    try{const res=await this.post("push",payload);
      if(res&&res.ok){localStorage.setItem(this.QKEY,"[]");this.setLast({ok:true,ts:new Date().toISOString(),sent:q.length});}
      else this.setLast({ok:false,ts:new Date().toISOString(),error:(res&&res.error)||"push rejected"});
      return res||{ok:false};}
    catch(e){this.setLast({ok:false,ts:new Date().toISOString(),error:String(e)});return{ok:false,error:String(e)};}}
};

   TEACHER DASHBOARD — cohort + per-student analytics
   Source: Google Sheet (all devices) when sync configured, else local
   device data (clearly labeled). Aggregation is pure & unit-tested.
   ===================================================================== */
function aggregateAnalytics(raw){
  const nid=x=>String(x==null?"":x);
  const students=(raw.students||[]).map(s=>({id:nid(s.StudentID),name:s.StudentName||s.StudentID,status:nid(s.AccountStatus)||"active"}));
  const attempts=(raw.events||[]).filter(e=>nid(e.EventType)==="attempt");
  const examEv=(raw.events||[]).filter(e=>nid(e.EventType)==="exam_result");
  const isC=e=>nid(e.Correct)==="true", isS=e=>nid(e.Skipped)==="true";
  const counted=attempts.filter(e=>!isS(e));
  const correct=counted.filter(isC);
  const seconds=(raw.sessions||[]).reduce((a,x)=>a+(Number(x.Seconds)||0),0);
  const byDay={};
  counted.forEach(e=>{const d=nid(e.Ts).slice(0,10);if(!d)return;const b=byDay[d]=byDay[d]||{date:d,attempts:0,correct:0,seconds:0};b.attempts++;if(isC(e))b.correct++;});
  (raw.sessions||[]).forEach(x=>{const d=nid(x.EndedAt||x.StartedAt).slice(0,10);if(!d)return;const b=byDay[d]=byDay[d]||{date:d,attempts:0,correct:0,seconds:0};b.seconds+=Number(x.Seconds)||0;});
  const byAct={};
  counted.forEach(e=>{const t=nid(e.ActivityType)||"?";const b=byAct[t]=byAct[t]||{type:t,attempts:0,correct:0};b.attempts++;if(isC(e))b.correct++;});
  const byLes={};
  const lb=id=>byLes[id]=byLes[id]||{lessonId:id,started:{},completed:{},attempts:0,correct:0};
  (raw.slp||[]).forEach(l=>{const b=lb(nid(l.LessonID));b.started[nid(l.StudentID)]=1;if(l.CompletedAt)b.completed[nid(l.StudentID)]=1;});
  counted.forEach(e=>{const b=lb(nid(e.LessonID));b.started[nid(e.StudentID)]=1;b.attempts++;if(isC(e))b.correct++;});
  const miss={};
  counted.forEach(e=>{const m=miss[nid(e.QuestionID)]=miss[nid(e.QuestionID)]||{questionId:nid(e.QuestionID),lessonId:nid(e.LessonID),activity:nid(e.ActivityType),attempts:0,wrong:0};m.attempts++;if(!isC(e))m.wrong++;});
  const per={};
  students.forEach(s=>per[s.id]={id:s.id,name:s.name,status:s.status,attempts:0,correct:0,incorrect:0,skipped:0,accuracy:null,seconds:0,sessions:0,lessonsStarted:0,lessonsCompleted:0,wordsMastered:0,wordsLearning:0,wordsRevision:0,exams:0,lastTs:null,byLesson:{},byActivity:{},missed:{},recent:[]});
  const P=id=>per[nid(id)];
  attempts.forEach(e=>{const p=P(e.StudentID);if(!p)return;
    if(isS(e)){p.skipped++;}else{p.attempts++;isC(e)?p.correct++:p.incorrect++;
      const t=nid(e.ActivityType)||"?";const a=p.byActivity[t]=p.byActivity[t]||{attempts:0,correct:0};a.attempts++;if(isC(e))a.correct++;
      const L=p.byLesson[nid(e.LessonID)]=p.byLesson[nid(e.LessonID)]||{attempts:0,correct:0};L.attempts++;if(isC(e))L.correct++;
      if(!isC(e))p.missed[nid(e.QuestionID)]=(p.missed[nid(e.QuestionID)]||0)+1;}
    if(!p.lastTs||nid(e.Ts)>p.lastTs)p.lastTs=nid(e.Ts);
    p.recent.push({ts:nid(e.Ts),type:nid(e.ActivityType),qid:nid(e.QuestionID),correct:isC(e),skipped:isS(e)});});
  (raw.sessions||[]).forEach(x=>{const p=P(x.StudentID);if(!p)return;p.seconds+=Number(x.Seconds)||0;p.sessions++;});
  (raw.slp||[]).forEach(l=>{const p=P(l.StudentID);if(!p)return;});
  students.forEach(s=>{const p=per[s.id];
    p.lessonsStarted=Object.keys((raw.slp||[]).reduce((a,l)=>{if(nid(l.StudentID)===s.id)a[nid(l.LessonID)]=1;return a;},{})).length;
    p.lessonsCompleted=(raw.slp||[]).filter(l=>nid(l.StudentID)===s.id&&l.CompletedAt).length;});
  (raw.svp||[]).forEach(v=>{const p=P(v.StudentID);if(!p)return;
    const st=nid(v.State);if(st==="mastered")p.wordsMastered++;else if(st==="needs_revision")p.wordsRevision++;else if(st==="learning")p.wordsLearning++;});
  examEv.forEach(e=>{const p=P(e.StudentID);if(p)p.exams++;});
  students.forEach(s=>{const p=per[s.id];p.accuracy=p.attempts?Math.round(p.correct/p.attempts*100):null;
    p.recent.sort((a,b)=>b.ts.localeCompare(a.ts));p.recent=p.recent.slice(0,12);});
  /* per-lesson deep dive */
  const lessons={};
  const L=id=>lessons[id]=lessons[id]||{lessonId:id,students:{},byActivity:{},missed:{},seconds:0,exams:0,vocab:{mastered:0,learning:0,revision:0}};
  counted.forEach(e=>{const l=L(nid(e.LessonID));
    const st=l.students[nid(e.StudentID)]=l.students[nid(e.StudentID)]||{attempts:0,correct:0};
    st.attempts++;if(isC(e))st.correct++;
    const a=l.byActivity[nid(e.ActivityType)]=l.byActivity[nid(e.ActivityType)]||{attempts:0,correct:0};
    a.attempts++;if(isC(e))a.correct++;
    if(!isC(e))l.missed[nid(e.QuestionID)]=(l.missed[nid(e.QuestionID)]||0)+1;});
  (raw.sessions||[]).forEach(x=>{L(nid(x.LessonID)).seconds+=Number(x.Seconds)||0;});
  examEv.forEach(e=>{L(nid(e.LessonID)).exams++;});
  (raw.svp||[]).forEach(v=>{const l=L(nid(v.LessonID));const stt=nid(v.State);
    if(stt==="mastered")l.vocab.mastered++;else if(stt==="needs_revision")l.vocab.revision++;else if(stt==="learning")l.vocab.learning++;});
  Object.values(lessons).forEach(l=>{l.studentList=Object.entries(l.students).map(([id,v])=>({id,attempts:v.attempts,correct:v.correct,accuracy:v.attempts?Math.round(v.correct/v.attempts*100):null})).sort((a,b)=>b.attempts-a.attempts);
    l.missedList=Object.entries(l.missed).map(([qid,n])=>({qid,n})).sort((a,b)=>b.n-a.n);
    l.attempts=Object.values(l.students).reduce((a,v)=>a+v.attempts,0);
    l.correct=Object.values(l.students).reduce((a,v)=>a+v.correct,0);
    l.accuracy=l.attempts?Math.round(l.correct/l.attempts*100):null;});
  const weekAgo=new Date(Date.now()-7*864e5).toISOString();
  return{source:raw.source||"?",lessons: Object.values(lessons).sort((a,b)=>String(a.lessonId).localeCompare(String(b.lessonId))),
    cohort:{students:students.length,active:students.filter(s=>per[s.id].lastTs>=weekAgo).length,
      attempts:counted.length,correct:correct.length,incorrect:counted.length-correct.length,
      skipped:attempts.length-counted.length,
      accuracy:counted.length?Math.round(correct.length/counted.length*100):null,
      seconds,sessions:(raw.sessions||[]).length,exams:examEv.length},
    byDay:Object.values(byDay).sort((a,b)=>a.date.localeCompare(b.date)),

function pySpan(text,force){ // pinyin element honoring global toggle
  if(!text)return null;
  if(!mySettings().pinyin&&!force)return null;

}
function runTimer(chId){ // practice-time tracker for a session
  const t0=Date.now();const runId=uid("sess");
  return{stop(){const sec=(Date.now()-t0)/1000;logTime(sec);
    const sid=sheetStudentId();
    if(sid&&SYNC.enabled()&&chId){
      SYNC.enqueue("session",{SessionID:runId,StudentID:sid,LessonID:lessonIdOf(chId),
        StartedAt:new Date(t0).toISOString(),EndedAt:new Date().toISOString(),Seconds:Math.round(sec)});
      const u=me();const cp=u&&((DB.chapterProgress[u.id]||{})[chId]);
      if(cp){const acts=cp.activities||{};let A=0,C=0;Object.values(acts).forEach(a=>{A+=a.total||0;C+=a.correct||0;});
        SYNC.enqueue("lesson",{StudentID:sid,LessonID:lessonIdOf(chId),StartedAt:cp.startedAt||"",
          LastPracticedAt:cp.lastPracticedAt||"",ActivitiesUsed:Object.keys(acts).length,
          Attempts:A,Correct:C,Accuracy:A?Math.round(C/A*100):"",CompletedAt:cp.completedAt||""});}

/* normalize a stored question into presentation form (options shuffled) */
function normalizeQ(q){
  const opts=shuffle(q.options.map((o,i)=>({...o,oid:i})));
  return{...q,_opts:opts,_correctIdx:opts.findIndex(o=>o.correct)};
}
function optLabel(nq,i){const o=nq._opts[i];
  if(o.hanzi!==undefined)return h("span",{},h("span",{class:"hanzi"},o.hanzi),
    (o.pinyin&&!o.pinyinUnverified)?h("span",{class:"py pyv",style:"margin-left:8px"},o.pinyin):null,
    o.pinyinUnverified?h("span",{class:"py pyv",style:"margin-left:8px;color:var(--warn)"},"(pinyin unverified)"):null);
  return h("span",{},o.text);
}

/* prompt renderers per type */
function renderPrompt(nq){
  const st=mySettings();
  const box=h("div",{});
  switch(nq.type){
    case"vocab_c2e":
      box.appendChild(h("div",{class:"qprompt big hanzi"},nq.hanzi));
      if(nq.pinyin)box.appendChild(h("div",{class:"qpinyin pyv"},nq.pinyin));
      if(nq.posHint)box.appendChild(h("span",{class:"chip progress",style:"margin:4px auto 0;display:table;font-size:11px"},"part of speech (source): "+nq.posHint));
      box.appendChild(h("div",{class:"qen"},"Choose the correct English meaning"));
      break;
    case"vocab_e2c":
      box.appendChild(h("div",{class:"qprompt",style:"font-size:24px;font-weight:600"},nq.english));
      box.appendChild(h("div",{class:"qen"},"Choose the correct Chinese word"));
      break;
    case"listening": // integrity: no hanzi/pinyin before submit
      box.appendChild(h("div",{class:"qen",style:"margin-bottom:6px"},"Listen and choose the correct English meaning"));
      if(nq.posHint)box.appendChild(h("span",{class:"chip progress",style:"margin:0 auto 10px;display:table;font-size:11px"},"word class (source): "+nq.posHint));
      box.appendChild(audioControl(nq.audioText));
      break;
    case"sent_e2c":
      box.appendChild(h("div",{class:"qprompt",style:"font-size:19px;font-weight:600"},nq.english));
      box.appendChild(h("div",{class:"qen"},"Choose the correct Chinese sentence"));
      break;
    case"sent_c2e":
      box.appendChild(h("div",{class:"qprompt hanzi",style:"font-size:23px"},nq.hanzi));
      if(nq.pinyin)box.appendChild(h("div",{class:"qpinyin pyv"},nq.pinyin));
      box.appendChild(h("div",{class:"qen"},"Choose the correct English translation"));
      break;
    case"cloze":{
      const segs=[...nq.segments];segs[nq.blankIndex]="____";
      box.appendChild(h("div",{class:"qprompt hanzi",style:"font-size:26px"},segs.join("")));
      if(st.pinyin&&nq.pinyin&&false)box.appendChild(h("div",{class:"qpinyin"},nq.pinyin)); // hide full pinyin: would leak the answer
      box.appendChild(h("div",{class:"qen"},"Choose the word that completes the source sentence"));
      break;}
  }
  return box;
}
function audioControl(text){
  const wrap=h("div",{});
  let rate=1,playing=false;
  const btn=h("button",{class:"audiobtn",title:"Play audio",onclick:async()=>{
    if(!Audio_.supported){fb.textContent="Audio is not supported in this browser. Fallback: the word will be revealed after you answer.";fb.style.display="block";return;}
    playing=true;btn.classList.add("playing");
    const r=await Audio_.speak(text,rate);
    playing=false;btn.classList.remove("playing");
    if(!r.ok&&r.reason!=="timeout"){fb.textContent="⚠ Audio playback failed ("+r.reason+"). The written word is revealed after submission as a fallback.";fb.style.display="block";}
  }},"🔊");
  const fb=h("div",{class:"notice warn",style:"display:none;margin-top:12px;font-size:12.5px"});
  const speeds=h("div",{class:"speedctl"},...[0.75,1,1.25].map(s=>{
    const b=h("button",{class:s===1?"on":"",onclick:()=>{rate=s;$$("button",b.parentElement).forEach(x=>x.classList.remove("on"));b.classList.add("on");}},s+"×");return b;}));
  wrap.appendChild(btn);wrap.appendChild(h("div",{},speeds,fb));
  if(!Audio_.supported)fb.textContent="This browser does not support speech synthesis. No audio will be simulated — the word is revealed after submission.",fb.style.display="block";
  return wrap;
}

/* ================= MCQ RUNNER (practice modes) ================= */
function mcqRunner(content,{title,type,chId,questions,mode="practice"}){
  const st=mySettings();
  const timer=runTimer(chId);
  const runId=uid("run");
  const list=questions.map(normalizeQ);
  let idx=0,score=0,answered=0;
  const results=[];
  const view=h("div",{class:"runner fade"});
  content.appendChild(view);

  function draw(){
    view.innerHTML="";
    const nq=list[idx];
    const timed=st.timed&&mode!=="exam";
    view.appendChild(h("div",{class:"rtop"},
      h("button",{class:"btn sm ghost",onclick:()=>{timer.stop();Audio_.stop();location.hash="#/chapter/"+chId;}},"✕ Quit"),
      h("div",{class:"progress"},h("div",{style:"width:"+(idx/list.length*100)+"%"})),
      h("span",{style:"font-size:13px;color:var(--muted);white-space:nowrap"},"Q "+(idx+1)+" / "+list.length),
      timed?h("span",{class:"chip review",id:"tchip"},"⏱"):null));
    const tbar=timed?h("div",{class:"timerbar"},h("div",{style:"width:100%"})):null;
    if(tbar)view.appendChild(tbar);

    const qcard=h("div",{class:"qcard"});
    qcard.appendChild(h("div",{style:"font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px"},
      (ACT[type]?ACT[type].n:type)+(mode==="quick"?" · Quick Practice":mode==="complete"?" · Complete Practice":"")));
    qcard.appendChild(renderPrompt(nq));
    const twoCol=nq._opts[0].hanzi!==undefined||nq._opts.every(o=>(o.text||"").length<=24);
    const optsBox=h("div",{class:"opts"+(twoCol?" two":"")});
    const optBtns=[];
    let selected=null,submitted=false;
    nq._opts.forEach((o,i)=>{
      const b=h("button",{class:"opt",onclick:()=>{if(submitted)return;selected=i;optBtns.forEach((x,j)=>x.classList.toggle("sel",j===i));}},
        h("span",{class:"key"},"ABCD"[i]||(i+1)),optLabel(nq,i));
      optBtns.push(b);optsBox.appendChild(b);
    });
    qcard.appendChild(optsBox);
    const fb=h("div",{class:"fb",style:"display:none"});
    qcard.appendChild(fb);
    const ctl=h("div",{style:"display:flex;gap:10px;justify-content:center;margin-top:16px"});
    const submitBtn=h("button",{class:"btn primary",disabled:true,onclick:()=>doSubmit(false)},"Submit");
    const nextBtn=h("button",{class:"btn primary",style:"display:none",onclick:()=>next()},"Next →");
    ctl.appendChild(submitBtn);ctl.appendChild(nextBtn);
    qcard.appendChild(ctl);
    view.appendChild(qcard);

    /* selection enables submit */
    const origClick=optBtns.map(b=>b.onclick);
    optBtns.forEach((b,i)=>b.onclick=()=>{if(submitted)return;selected=i;optBtns.forEach((x,j)=>x.classList.toggle("sel",j===i));submitBtn.disabled=false;});

    /* timed countdown */
    let tInt=null,remain=st.timePerQ;
    if(timed){
      const fill=$("div",tbar);
      tInt=setInterval(()=>{
        remain--;fill.style.width=(remain/st.timePerQ*100)+"%";
        if(remain<=st.timePerQ*0.3)fill.classList.add("low");
        if(remain<=0){clearInterval(tInt);if(!submitted)doSubmit(true);}
      },1000);
    }
    const qStart=Date.now();

    function doSubmit(timedOut){
      if(submitted)return;submitted=true;
      if(tInt)clearInterval(tInt);
      Audio_.stop();
      const correctSel=!timedOut&&selected===nq._correctIdx;
      if(timedOut||selected===null){
        recordAttempt({chapterId:chId,questionId:nq.id,type:nq.type,submitted:null,correct:false,skipped:true,runId,ms:Date.now()-qStart});
        results.push({nq,skipped:true});
      }else{
        answered++;if(correctSel)score++;
        recordAttempt({chapterId:chId,questionId:nq.id,type:nq.type,
          submitted:nq._opts[selected].text??nq._opts[selected].hanzi,correct:correctSel,runId,ms:Date.now()-qStart});
        results.push({nq,selected,correctSel});
      }
      optBtns.forEach((b,i)=>{b.disabled=true;
        if(i===nq._correctIdx)b.classList.add("correct");
        else if(i===selected&&!correctSel)b.classList.add("wrong");});
      submitBtn.style.display="none";nextBtn.style.display="inline-flex";
      nextBtn.textContent=idx===list.length-1?"See results →":"Next →";
      fb.className="fb "+(timedOut||selected===null?"bad":correctSel?"good":"bad");
      const reveal=nq.type==="listening"?h("div",{style:"margin-top:6px"},
          h("span",{class:"hanzi",style:"font-size:17px"},nq.hanzi)," ",nq.pinyin?h("span",{class:"pyv",style:"color:var(--cat-vocab)"},nq.pinyin):null):null;
      fb.appendChild(h("div",{class:"ttl"},timedOut?"⏱ Time's up — counted as skipped (excluded from accuracy)":correctSel?"✓ Correct!":"✗ Incorrect"));
      if(reveal)fb.appendChild(reveal);
      if(nq.explanation)fb.appendChild(h("div",{style:"color:var(--muted);font-size:13px;margin-top:3px"},nq.explanation));
      fb.style.display="block";
      saveDB();
    }
    function next(){
      idx++;
      if(idx>=list.length){drawResults();return;}
      draw();
    }
    /* keyboard: 1-4 select, Enter submit/next */
    view.onkeydown=e=>{
      if("1234".includes(e.key)&&!submitted&&nq._opts[+e.key-1]){optBtns[+e.key-1].click();}
      if(e.key==="Enter"){if(!submitted&&!submitBtn.disabled)doSubmit(false);else if(submitted)next();}
    };
    view.tabIndex=0;view.focus();
  }

  function drawResults(){
    view.innerHTML="";
    const pct=answered?Math.round(score/answered*100):0;
    const color=pct>=80?"var(--ok)":pct>=50?"var(--warn)":"var(--bad)";
    view.appendChild(h("div",{class:"card",style:"text-align:center"},
      h("h2",{style:"margin-bottom:14px"},(ACT[type]?ACT[type].n:type)+" — Results"),
      ring(answered?pct:null,color,"score"),
      h("p",{},h("b",{},score+" correct")," · "+(answered-score)+" incorrect · "+(results.filter(r=>r.skipped).length)+" skipped (excluded from accuracy)"),
      h("p",{style:"font-size:12px;color:var(--dim);margin-top:4px"},"Attempts recorded to your real statistics. Vocabulary mastery updates per the rule in Settings."),
      h("div",{style:"display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap"},
        h("button",{class:"btn",onclick:()=>{idx=0;score=0;answered=0;results.length=0;list.forEach((q,i)=>list[i]=normalizeQ(DB.questions.find(x=>x.id===q.id)));draw();}},"↻ Retry (reshuffled)"),
        h("a",{href:"#/chapter/"+chId,class:"btn ghost"},"Back to chapter"),
        results.some(r=>!r.correct&&!r.skipped)?h("a",{href:"#/wrong",class:"btn primary"},"Review wrong answers"):null)));
    /* per-question review */
    view.appendChild(h("div",{class:"card",style:"margin-top:14px"},
      h("h3",{style:"font-size:14.5px;margin-bottom:10px"},"Answer review"),
      ...results.map(r=>h("div",{class:"kv"},
        h("span",{class:"hanzi"},r.nq.hanzi||r.nq.english||"—"),
        h("span",{style:"font-size:12.5px;color:var(--muted)"},r.skipped?"skipped":r.correctSel?"✓ correct":"✗ your answer: "+String(r.nq._opts[r.selected].text??r.nq._opts[r.selected].hanzi)),
        h("span",{style:"font-size:12.5px;color:var(--ok)"},r.correctSel?"":"correct: "+String(r.nq._opts[r.nq._correctIdx].text??r.nq._opts[r.nq._correctIdx].hanzi))))));
    timer.stop();
  }
  draw();
}

/* ================= MATCHING RUNNER (Activity 3) ================= */
function matchingRunner(content,{chId,words}){
  const timer=runTimer(chId),runId=uid("run");
  const rounds=[];const pool=shuffle(words);
  for(let i=0;i<pool.length;i+=6)rounds.push(pool.slice(i,i+6));
  let ri=0,correct=0,wrong=0;
  const view=h("div",{class:"runner fade"});content.appendChild(view);
  function drawRound(){
    const round=rounds[ri];
    const left=shuffle(round.map(w=>({w,side:"cn"})));
    const right=shuffle(round.map(w=>({w,side:"en"})));
    let selL=null,selR=null,matched=new Set();
    view.innerHTML="";
    view.appendChild(h("div",{class:"rtop"},
      h("button",{class:"btn sm ghost",onclick:()=>{timer.stop();location.hash="#/chapter/"+chId;}},"✕ Quit"),
      h("div",{class:"progress"},h("div",{style:"width:"+(ri/rounds.length*100)+"%"})),
      h("span",{style:"font-size:13px;color:var(--muted)"},"Round "+(ri+1)+"/"+rounds.length+" · ✓"+correct+" ✗"+wrong)));
    view.appendChild(h("div",{class:"card"},
      h("h3",{style:"font-size:14px;margin-bottom:12px;text-align:center"},"Tap a Chinese word, then its English meaning (click-to-match; works on touch)"),
      h("div",{style:"display:grid;grid-template-columns:1fr 1fr;gap:12px"},
        h("div",{class:"mcol"},...left.map((it,i)=>{
          const b=h("button",{class:"mtile hanzi",style:"font-size:19px",onclick:()=>pick("cn",it,i,b)},
            it.w.hanzi,it.w.pinyin?h("small",{class:"pyv",style:"display:block;font-size:11.5px;color:var(--cat-vocab);font-family:inherit"},it.w.pinyin):null);
          b._i=i;return b;})),
        h("div",{class:"mcol"},...right.map((it,i)=>{
          const b=h("button",{class:"mtile",onclick:()=>pick("en",it,i,b)},it.w.english);b._i=i;return b;})))));
    const msg=h("div",{style:"text-align:center;font-size:13px;color:var(--muted);margin-top:10px"},round.length-matched.size+" pairs remaining");
    view.appendChild(msg);
    function pick(side,it,i,btn){
      if(matched.has(it.w.id+"_"+side))return;
      if(side==="cn"){if(selL)selL.btn.classList.remove("sel");selL={it,btn};btn.classList.add("sel");}
      else{if(selR)selR.btn.classList.remove("sel");selR={it,btn};btn.classList.add("sel");}
      if(selL&&selR){
        const ok=selL.it.w.id===selR.it.w.id;
        if(ok){correct++;matched.add(selL.it.w.id+"_cn");matched.add(selR.it.w.id+"_en");
          selL.btn.classList.remove("sel");selR.btn.classList.remove("sel");
          selL.btn.classList.add("matched");selR.btn.classList.add("matched");
          selL.btn.disabled=true;selR.btn.disabled=true;
          // record as an attempt on the word's E2C-style question if exists
          const q=questionsOf(chId,"vocab_e2c").find(q=>q.wordId===selR.it.w.id);
          recordAttempt({chapterId:chId,questionId:q?q.id:"match_"+selR.it.w.id,type:"matching",
            submitted:selL.it.w.hanzi+"↔"+selR.it.w.english,correct:true,runId});
        }else{wrong++;
          [selL.btn,selR.btn].forEach(b=>{b.classList.add("shake");setTimeout(()=>{b.classList.remove("shake","sel");},380);});
          const q=questionsOf(chId,"vocab_e2c").find(q=>q.wordId===selR.it.w.id);
          recordAttempt({chapterId:chId,questionId:q?q.id:"match_"+selR.it.w.id,type:"matching",
            submitted:selL.it.w.hanzi+"↔"+selR.it.w.english,correct:false,runId});
        }
        selL=null;selR=null;
        msg.textContent=round.length-[...matched].filter(x=>x.endsWith("_cn")).length+" pairs remaining";
        if([...matched].filter(x=>x.endsWith("_cn")).length===round.length){
          setTimeout(()=>{ri++;
            if(ri>=rounds.length)drawDone();else drawRound();},550);
        }
      }
    }
  }
  function drawDone(){
    view.innerHTML="";
