/* ================= TRIPLE MATCH (Activity 6) ================= */
function tripleRunner(content,{chId,words,timed}){
  const timer=runTimer(chId),runId=uid("run");
  const usable=words.filter(w=>w.pinyin||!mySettings().pinyin);
  const rounds=[];const pool=shuffle(usable);
  for(let i=0;i<pool.length;i+=4)if(pool.length-i>=3)rounds.push(pool.slice(i,i+4));
  let ri=0,correct=0,wrong=0,t0=Date.now();
  const view=h("div",{class:"runner fade"});content.appendChild(view);
  if(!rounds.length){view.appendChild(h("div",{class:"empty"},h("h3",{},"Not enough pinyin-verified words"),"p","Triple Match needs hanzi + pinyin + English. Words without verified pinyin are excluded (pinyin is never invented)."));return;}
  function drawRound(){
    const round=rounds[ri];
    const cols=[shuffle(round.map(w=>({w,f:"hanzi"}))),shuffle(round.map(w=>({w,f:"pinyin"}))),shuffle(round.map(w=>({w,f:"english"})))];
    let picks=[null,null,null];
    view.innerHTML="";
    view.appendChild(h("div",{class:"rtop"},
      h("button",{class:"btn sm ghost",onclick:()=>{timer.stop();location.hash="#/chapter/"+chId;}},"✕ Quit"),
      h("div",{class:"progress"},h("div",{style:"width:"+(ri/rounds.length*100)+"%"})),
      h("span",{style:"font-size:13px;color:var(--muted)"},"Round "+(ri+1)+"/"+rounds.length+" · ✓"+correct+" ✗"+wrong+(timed?" · ⏱ "+fmtDur((Date.now()-t0)/1000):""))));
    view.appendChild(h("div",{class:"card"},
      h("p",{style:"text-align:center;font-size:13px;color:var(--muted);margin-bottom:12px"},"Pick one tile from each column: 汉字 · pinyin · English"),
      h("div",{style:"display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"},
        ...cols.map((col,ci)=>h("div",{class:"mcol"},...col.map((it,i)=>{
          const txt=it.w[it.f];
          const b=h("button",{class:"mtile"+(it.f==="hanzi"?" hanzi":""),style:it.f==="hanzi"?"font-size:20px":it.f==="pinyin"?"color:var(--cat-vocab)":"",
            onclick:()=>{
              if(b.classList.contains("matched"))return;
              $$(".mtile",b.parentElement).forEach(x=>{if(!x.classList.contains("matched"))x.classList.remove("sel")});
              b.classList.add("sel");picks[ci]={it,btn:b};
              if(picks.every(Boolean))check();
            }},txt);
          return b;})))))); 
    function check(){
      const[a,b2,c]=picks.map(p=>p.it.w.id);
      if(a===b2&&b2===c){correct++;
        picks.forEach(p=>{p.btn.classList.remove("sel");p.btn.classList.add("matched");p.btn.disabled=true;});
        const q=questionsOf(chId,"vocab_c2e").find(q=>q.wordId===a);
        recordAttempt({chapterId:chId,questionId:q?q.id:"triple_"+a,type:"triple",submitted:"triple-match",correct:true,runId});
      }else{wrong++;
        picks.forEach(p=>{p.btn.classList.add("shake");setTimeout(()=>p.btn.classList.remove("shake","sel"),380);});
        const q=questionsOf(chId,"vocab_c2e").find(q=>q.wordId===a);
        recordAttempt({chapterId:chId,questionId:q?q.id:"triple_"+a,type:"triple",submitted:"triple-match",correct:false,runId});
      }
      picks=[null,null,null];
      const done=round.every(w=>$$(".mtile.matched").length>=0&&false); // noop
      const matchedCount=$$(".mtile.matched",view).length/3;
      if(matchedCount>=round.length){setTimeout(()=>{ri++;if(ri>=rounds.length)drawDone();else drawRound();},500);}
    }
  }
  function drawDone(){
    const secs=(Date.now()-t0)/1000;
    view.innerHTML="";
    view.appendChild(h("div",{class:"card",style:"text-align:center"},
      h("h2",{},"Triple Match complete"),
      h("p",{style:"margin:10px 0"},correct+" triples matched · "+wrong+" wrong selections"+(timed?" · time "+fmtDur(secs):"")),
      h("div",{style:"display:flex;gap:10px;justify-content:center"},
        h("button",{class:"btn primary",onclick:()=>{ri=0;correct=0;wrong=0;t0=Date.now();drawRound();}},"↻ Play again"),
        h("a",{href:"#/chapter/"+chId,class:"btn ghost"},"Back"))));
    timer.stop();
  }
  drawRound();
}

/* ================= EXAM RUNNER (Activity 11 / §11) ================= */
function examRunner(content,{chId,count,timed}){
  const ch=chapterById(chId);
  const bank=DB.questions.filter(q=>q.chapterId===chId&&q.validation!=="review"&&q.type!=="builder");
  const chosen=shuffle(bank).slice(0,Math.min(count,bank.length)).map(normalizeQ);
  if(chosen.length<3){content.appendChild(h("div",{class:"notice err"},"Exam needs at least 3 validated questions; this chapter has "+bank.length+". Omitting exam rather than inventing questions (§11)."));return;}
  const timer=runTimer(chId),t0=Date.now();
  let idx=0;const answers=new Array(chosen.length).fill(null);
  const view=h("div",{class:"runner fade"});content.appendChild(view);
  function draw(){
    const nq=chosen[idx];
    view.innerHTML="";
    view.appendChild(h("div",{class:"rtop"},
      h("button",{class:"btn sm ghost",onclick:()=>{if(confirm("Leave exam? This attempt will not be graded.")){timer.stop();location.hash="#/chapter/"+chId;}}},"✕ Leave"),
      h("div",{class:"progress"},h("div",{style:"width:"+((idx)/chosen.length*100)+"%"})),
      h("span",{style:"font-size:13px;color:var(--muted)"},"Exam Q "+(idx+1)+" / "+chosen.length),
      timed?h("span",{class:"chip review"},"⏱ "+fmtDur((Date.now()-t0)/1000)):null));
    const qcard=h("div",{class:"qcard"});
    qcard.appendChild(h("div",{style:"font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px"},ACT[nq.type].n+" · no feedback until the end"));
    qcard.appendChild(renderPrompt(nq));
    const twoColX=nq._opts[0].hanzi!==undefined||nq._opts.every(o=>(o.text||"").length<=24);
    const optsBox=h("div",{class:"opts"+(twoColX?" two":"")});
    nq._opts.forEach((o,i)=>{
      optsBox.appendChild(h("button",{class:"opt"+(answers[idx]===i?" sel":""),onclick:()=>{answers[idx]=i;draw();}},
        h("span",{class:"key"},"ABCD"[i]),optLabel(nq,i)));
    });
    qcard.appendChild(optsBox);
    qcard.appendChild(h("div",{style:"display:flex;gap:10px;justify-content:center;margin-top:18px"},
      h("button",{class:"btn",disabled:idx===0,onclick:()=>{idx--;draw();}},"← Prev"),
      idx===chosen.length-1
        ?h("button",{class:"btn primary",onclick:finish},"Finish & grade ✓")
        :h("button",{class:"btn primary",onclick:()=>{idx++;draw();}},"Next →")));
    /* question palette */
    qcard.appendChild(h("div",{style:"display:flex;gap:5px;justify-content:center;margin-top:14px;flex-wrap:wrap"},
      ...chosen.map((_,j)=>h("button",{style:"width:26px;height:26px;border-radius:7px;font-size:11px;border:1px solid "+(answers[j]!==null?"var(--accent)":"var(--line)")+";background:"+(j===idx?"var(--accent-soft)":"var(--card2)")+";color:"+(answers[j]!==null?"var(--accent2)":"var(--dim)"),onclick:()=>{idx=j;draw();}},j+1))));
    view.appendChild(qcard);
  }
  function finish(){
    const unanswered=answers.filter(a=>a===null).length;
    if(unanswered&&!confirm(unanswered+" question(s) unanswered. Grade anyway? (Unanswered are excluded from accuracy, counted as skipped.)"))return;
    let score=0;const responses=[];
    chosen.forEach((nq,i)=>{
      const sel=answers[i];
      const ok=sel!==null&&sel===nq._correctIdx;
      if(ok)score++;
      recordAttempt({chapterId:chId,questionId:nq.id,type:nq.type,
        submitted:sel===null?null:(nq._opts[sel].text??nq._opts[sel].hanzi),correct:ok,skipped:sel===null,runId:"exam",ms:0});
      responses.push({qid:nq.id,type:nq.type,selected:sel,correctIdx:nq._correctIdx,ok,skipped:sel===null});
    });
    const dur=Math.round((Date.now()-t0)/1000);
    DB.exams.push({id:uid("exam"),userId:me().id,chapterId:chId,ts:new Date().toISOString(),
      score,total:chosen.length,timed,durationSec:dur,responses});
    saveDB();
    const sidX=sheetStudentId();
    if(sidX&&SYNC.enabled())SYNC.enqueue("exam",{StudentID:sidX,LessonID:lessonIdOf(chId),
      Ts:new Date().toISOString(),Score:score,Total:chosen.length,
      Timed:timed?"true":"false",DurationSec:dur});
    drawExamResult(chosen,responses,score,dur);
  }
  function drawExamResult(chosen,responses,score,dur){
    view.innerHTML="";
    const pct=Math.round(score/chosen.length*100);
    const color=pct>=80?"var(--ok)":pct>=50?"var(--warn)":"var(--bad)";
    view.appendChild(h("div",{class:"card",style:"text-align:center"},
      h("h2",{},"Chapter "+chapterById(chId).num+" Exam — Result"),
      ring(pct,color,"score"),
      h("p",{},score+" / "+chosen.length+" correct · "+responses.filter(r=>r.skipped).length+" skipped · time "+fmtDur(dur)+(timed?" (timed)":" (untimed)")),
      h("p",{style:"font-size:12px;color:var(--dim);margin-top:4px"},"Saved to exam history. Coverage: "+new Set(chosen.map(q=>q.type)).size+" activity types drawn from the validated bank."),
      h("div",{style:"margin-top:14px"},h("a",{href:"#/chapter/"+chId,class:"btn ghost"},"Back to chapter"))));
    view.appendChild(h("div",{class:"card",style:"margin-top:14px"},
      h("h3",{style:"font-size:14.5px;margin-bottom:10px"},"Answer review"),
      ...chosen.map((nq,i)=>{const r=responses[i];
        return h("div",{class:"kv"},
          h("span",{},h("span",{style:"color:"+(r.skipped?"var(--dim)":r.ok?"var(--ok)":"var(--bad)")},r.skipped?"⏭":r.ok?"✓":"✗")," ",
            h("span",{class:"hanzi"},nq.hanzi||nq.english||"—")),
          h("span",{style:"font-size:12px;color:var(--muted)"},(ACT[nq.type]||{}).n),
          h("span",{style:"font-size:12px"},r.ok?"":h("span",{style:"color:var(--ok)"},"answer: "+String(nq._opts[r.correctIdx].text??nq._opts[r.correctIdx].hanzi))));})));
    timer.stop();
  }
  draw();
}

        h("td",{class:"hanzi",style:"font-size:16px"},w.q?(w.q.hanzi||w.q.english||"—"):"(deleted question)"),
        h("td",{},h("span",{class:"chip "+(w.resolved?"ready":"review")},w.resolved?"resolved":"unresolved")),
        h("td",{style:"color:var(--muted);font-size:12.5px"},(ACT[w.type]||{n:w.type}).n),
        h("td",{style:"color:var(--dim);font-size:12.5px"},ch?"Ch "+ch.num:"—"),
        h("td",{style:"font-size:12.5px"},"✗ "+w.wrongCount+"× / "+w.attempts+" attempts"),
        h("td",{style:"color:var(--dim);font-size:12px"},fmtDate(w.lastTs)),
        h("td",{},w.q?h("button",{class:"btn sm ghost",onclick:()=>retryOne(w)},"Retry"):h("span",{style:"color:var(--dim)"},"—")));
    });
    box.appendChild(h("div",{class:"card",style:"padding:6px 14px;overflow-x:auto"},
      h("table",{class:"tbl"},h("thead",{},h("tr",{},h("th",{},"Question"),h("th",{},"Status"),h("th",{},"Activity"),h("th",{},"Chapter"),h("th",{},"Misses"),h("th",{},"Last attempt"),h("th",{},""))),
        h("tbody",{},...rows))));
  }
  function retryOne(w){
    const q=DB.questions.find(x=>x.id===w.qid);if(!q)return;
    content.innerHTML="";
    mcqRunner(content,{title:"Revision",type:q.type,chId:q.chapterId,questions:[q],mode:"revision"});
  }
  function startRevision(list){
    const qs=list.map(w=>DB.questions.find(x=>x.id===w.qid)).filter(Boolean);
    if(!qs.length)return;
    content.innerHTML="";
    const chId=qs[0].chapterId;
    mcqRunner(content,{title:"Targeted revision",type:qs[0].type,chId,questions:shuffle(qs),mode:"revision"});
  }
  draw();
};

        h("div",{class:"stat"},h("div",{class:"v"},st.totalAttempts),h("div",{class:"l"},"Submitted attempts"),h("div",{class:"d"},st.correct+" ✓ · "+st.incorrect+" ✗")),
        h("div",{class:"stat"},h("div",{class:"v"},st.uniqueQuestions),h("div",{class:"l"},"Unique questions"),h("div",{class:"d"},st.uniqueWrong+" ever missed")),

      body.appendChild(h("div",{class:"card",style:"margin-top:14px"},

        h("p",{style:"font-size:11.5px;color:var(--dim);margin-top:8px"},"Green = correct, red = incorrect, in chronological order.")));

      body.appendChild(activityBreakdown(body));

/* =====================================================================
   INIT + SELF-CHECK
   ===================================================================== */
function selfCheck(){
  const results=[];
  try{
    // fixture loads & validates
    if(!DB.chapters.some(c=>c.id==="fixture-demo"))loadFixture();
    const v=validateChapter("fixture-demo");
    results.push(["Fixture validation",v.ok,"issues: "+v.issues.length+", warnings: "+v.warnings.length]);
    // every MCQ has exactly one correct option
    const bad=DB.questions.filter(q=>q.options&&q.options.filter(o=>o.correct).length!==1);
    results.push(["Single correct answer per MCQ",bad.length===0,bad.length+" bad"]);
    // coverage: every fixture word appears in vocab_c2e
    const words=vocabOf("fixture-demo");
    const cov=words.every(w=>DB.questions.some(q=>q.type==="vocab_c2e"&&q.wordId===w.id));
    results.push(["Vocabulary coverage (C2E)",cov,words.length+" words"]);
    // shuffle preserves correct mapping
    const q=DB.questions.find(q=>q.type==="vocab_c2e");
    if(q){const n=normalizeQ(q);results.push(["Shuffle keeps answer key valid",n._opts[n._correctIdx].correct===true,""]);}
    // builder segments reconstruct source
    const bq=DB.questions.find(q=>q.type==="builder");
    if(bq){const src=DB.sentences.find(s=>s.id===bq.sentenceId);
      results.push(["Builder segments reconstruct source",bq.segments.join("")===src.hanzi,""]);}
    // accuracy math
    results.push(["Accuracy excludes skipped",(()=>{const a=[{correct:true,skipped:false},{correct:false,skipped:false},{skipped:true}];
      const f=a.filter(x=>!x.skipped);return Math.round(f.filter(x=>x.correct).length/f.length*100)===50;})(),""]);
  }catch(e){results.push(["Self-check error",false,e.message]);}
  return results;
}

}
