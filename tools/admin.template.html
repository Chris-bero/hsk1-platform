<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1 — Mission Control</title>
<style>
/* @@STYLE@@ */
/* ===== mission-control design system (admin site only) ===== */
:root{
  --bg:#0a0e13; --panel:#0f151c; --panel2:#141c26; --line:#1c2836; --line2:#2a3a4e;
  --txt:#dce7f3; --mut:#8296ab; --dim:#5a6d82;
  --cyan:#4cc9f0; --cyan2:#7dd8f5; --cyan-soft:rgba(76,201,240,.12);
  --coral:#ff5f52; --coral-soft:rgba(255,95,82,.12);
  --ok:#3ddc84; --ok-soft:rgba(61,220,132,.10);
  --warn:#ffc24d; --warn-soft:rgba(255,194,77,.10);
  --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(900px 400px at 80% -100px,rgba(76,201,240,.07),transparent 60%),
             radial-gradient(700px 380px at -10% 40%,rgba(255,95,82,.05),transparent 60%)}
.mono{font-family:var(--mono)}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:9px 12px;font-size:13px;outline:none}
input:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
a{color:var(--cyan2);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}

/* shell */
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
aside{width:236px;flex-shrink:0;border-right:1px solid var(--line);background:linear-gradient(180deg,var(--panel),#0b1016);display:flex;flex-direction:column;padding:18px 12px;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),#2b7ea8);display:flex;align-items:center;justify-content:center;font-weight:800;color:#04222e;font-family:var(--mono);font-size:15px;box-shadow:0 4px 16px rgba(76,201,240,.35)}
.brand b{font-size:14px;letter-spacing:.3px}
.brand small{display:block;font:600 9.5px var(--mono);color:var(--dim);letter-spacing:1.4px;text-transform:uppercase}
nav .nitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--mut);padding:10px 12px;border-radius:9px;font-size:13px;font-weight:600;transition:.15s;position:relative}
nav .nitem:hover{background:var(--panel2);color:var(--txt)}
nav .nitem.on{background:var(--cyan-soft);color:var(--cyan2)}
nav .nitem.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--cyan)}
nav .nitem .ic{width:18px;text-align:center;font-size:14px}
nav .nitem .cnt{margin-left:auto;font:700 10px var(--mono);background:var(--panel2);border:1px solid var(--line2);color:var(--mut);border-radius:8px;padding:1px 7px}
nav .nitem .cnt.hot{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.sidefoot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font:10.5px var(--mono);color:var(--dim);line-height:1.7}
main{flex:1;min-width:0;padding:0 26px 60px}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 0;margin-bottom:20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);z-index:5}
.topbar h1{font-size:17px;letter-spacing:-.2px}
.topbar .crumb{font:600 10px var(--mono);color:var(--dim);letter-spacing:1.6px;text-transform:uppercase}
.topbar .sp{flex:1}
.led{display:inline-flex;align-items:center;gap:7px;font:700 10.5px var(--mono);letter-spacing:.8px;text-transform:uppercase;padding:5px 11px;border-radius:20px;border:1px solid var(--line2);background:var(--panel);color:var(--mut)}
.led i{width:7px;height:7px;border-radius:50%;background:var(--dim);box-shadow:0 0 8px currentColor}
.led.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}.led.ok i{background:var(--ok)}
.led.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}.led.warn i{background:var(--warn)}
.led.err{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 40%,transparent);background:var(--coral-soft)}.led.err i{background:var(--coral)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--txt);font-weight:600;font-size:12.5px;transition:.15s}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:linear-gradient(135deg,var(--cyan),#2f9dc9);border-color:transparent;color:#03222d;box-shadow:0 4px 14px rgba(76,201,240,.3)}
.btn.danger{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 45%,transparent)}
.btn.sm{padding:5px 11px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* panels & data */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1100px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}aside{display:none}}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--cyan));opacity:.7}
.kpi .v{font:700 24px/1.1 var(--mono);letter-spacing:-.5px;color:var(--kc,var(--txt))}
.kpi .l{font:700 9.5px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-top:5px}
.kpi .d{font-size:11px;color:var(--mut);margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),transparent)}
.phead h3{font-size:13px;letter-spacing:.2px}
.phead .sub{font:10.5px var(--mono);color:var(--dim)}
.phead .sp{flex:1}
.pbody{padding:14px 16px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;font:700 9.5px var(--mono);letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);padding:9px 12px;border-bottom:1px solid var(--line2);background:var(--panel2);position:sticky;top:0}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:color-mix(in srgb,var(--panel2) 70%,transparent)}
table.tbl .num{font-family:var(--mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 10px var(--mono);letter-spacing:.6px;text-transform:uppercase;padding:3px 10px;border-radius:20px;border:1px solid}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.pill.err{color:var(--coral);border-color:color-mix(in srgb,var(--coral) 40%,transparent);background:var(--coral-soft)}
.pill.mut{color:var(--mut);border-color:var(--line2);background:var(--panel2)}
.pill.cy{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,transparent);background:var(--cyan-soft)}
.bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--cyan),#2f9dc9)}
.bar.g>div{background:linear-gradient(90deg,var(--ok),#1fa860)}
.bar.w>div{background:linear-gradient(90deg,var(--warn),#e09a20)}
.notice{border-radius:8px;padding:11px 14px;font-size:12.5px;border:1px solid;margin-bottom:12px}
.notice.info{background:var(--cyan-soft);border-color:color-mix(in srgb,var(--cyan) 35%,transparent);color:var(--cyan2)}
.notice.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent);color:var(--ok)}
.notice.err{background:var(--coral-soft);border-color:color-mix(in srgb,var(--coral) 35%,transparent);color:#ff9a92}
.notice.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--mut)}
.kv .val{font-family:var(--mono);font-size:12px}
textarea{width:100%;min-height:180px;font:12px/1.6 var(--mono);resize:vertical}
.field label{display:block;font:700 10px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.field{margin-bottom:14px}
.authwrap{max-width:430px;margin:9vh auto;padding:0 14px}
.authwrap .panel{padding:0}
.authwrap .pbody{padding:24px}
.hint{font-size:11.5px;color:var(--dim);line-height:1.7}
details.schema summary{cursor:pointer;color:var(--cyan);font:600 12px var(--mono);padding:6px 0}
details.schema pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font:11.5px/1.6 var(--mono);margin-top:8px;color:var(--mut)}
.fade{animation:fi .25s cubic-bezier(.22,1,.36,1)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
window.addEventListener("error",function(ev){
  try{var d=document.createElement("div");
  d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:999;background:#7a1020;color:#fff;padding:10px 16px;font:12px ui-monospace,monospace;white-space:pre-wrap";
  d.textContent="PAGE ERROR: "+(ev.message||"unknown")+" @ line "+(ev.lineno||"?")+" — copy this message to the developer";
  (document.body||document.documentElement).appendChild(d);}catch(e){}
});
/* =====================================================================
   ADMIN / TEACHER MISSION CONTROL — separate site from the student app.
   Shares the core engine + SYNC client injected from index.html between
   @@CORE-START@@ / @@CORE-END@@. Do not edit the core here:
   edit index.html, then run:  python3 tools/build_admin.py
   ===================================================================== */
/* @@CORE@@ */

/* =====================================================================
   Admin UI (this file only)
   ===================================================================== */
const $A=(s,r=document)=>r.querySelector(s);
let tab=(location.hash==="#teacher")?"analytics":"overview";
let openReport=null;

function deleteChapter(id){
  const ch=chapterById(id);if(!ch)return;
  if(!confirm('Delete chapter "'+ch.title+'" and ALL its vocab, sentences and generated questions?\nStudent attempt history is kept (questions become orphaned in stats).'))return;
  DB.chapters=DB.chapters.filter(c=>c.id!==id);
  DB.vocab=DB.vocab.filter(v=>v.chapterId!==id);
  DB.sentences=DB.sentences.filter(s=>s.chapterId!==id);
  DB.questions=DB.questions.filter(q=>q.chapterId!==id);
  saveDB();render();
}
function revalidate(id){const ch=chapterById(id);if(!ch)return;
  ch.validation=validateChapter(id);
  if(isReady(ch))ch.status=ch.validation.ok?(ch.validation.flagged>0?"review":"ready"):"review";
  saveDB();render();}
function regenerate(id){const ch=chapterById(id);if(!ch)return;
  if(!confirm("Regenerate the question bank for this chapter? Existing bank questions for it are replaced (attempts history is kept)."))return;
  const rep=genQuestionsForChapter(id);
  ch.validation={...validateChapter(id),gen:rep};
  if(isReady(ch))ch.status=ch.validation.ok?(ch.validation.flagged>0?"review":"ready"):"review";
  saveDB();render();}
function deleteUserAccount(id){
  const x=DB.users.find(u=>u.id===id);if(!x||x.id===me().id)return;
  if(!confirm("Delete account "+x.name+" and all their progress on this device?"))return;
  DB.users=DB.users.filter(u=>u.id!==id);
  DB.attempts=DB.attempts.filter(a=>a.userId!==id);
  DB.exams=DB.exams.filter(e=>e.userId!==id);
  DB.timeLog=DB.timeLog.filter(t=>t.userId!==id);
  delete DB.vocabProgress[id];delete DB.chapterProgress[id];delete DB.settings[id];
  saveDB();render();}

/* ---------------- shell ---------------- */
function render(){
  applyTheme();applyPinyinClass();
  document.documentElement.setAttribute("data-theme","dark");
  ensureCurriculumImported();
  const app=$A("#app");app.innerHTML="";
  const u=me();
  if(!u||u.role!=="admin"){drawGate(app,u);return;}
  drawShell(app,u);
}
function drawGate(app,u){
  const wrap=h("div",{class:"authwrap fade"});
  const card=h("div",{class:"panel"},
    h("div",{class:"phead"},h("div",{class:"logo mono",style:"width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),#2b7ea8);color:#04222e;display:flex;align-items:center;justify-content:center;font-weight:800"},"HSK"),
      h("h3",{},"Mission Control — staff access only")),
    h("div",{class:"pbody"}));
  if(u){
    card.querySelector(".pbody").appendChild(
      h("div",{class:"notice err"},"Logged in as <b>"+u.name+"</b> (student role). Staff functions require an admin account."),
      h("div",{style:"display:flex;gap:10px"},
        h("button",{class:"btn",onclick:()=>{DB.sessionUserId=null;saveDB();render();}},"Switch account"),
        h("a",{href:"index.html",class:"btn"},"← Student site")));
  }else if(!DB.users.length){
    const err0=h("div",{class:"notice err",style:"display:none"});
    const nI=h("input",{placeholder:"Owner display name",style:"width:100%"});
    const pI2=h("input",{type:"password",placeholder:"Owner password (min 4 chars)",style:"width:100%"});
    card.querySelector(".pbody").appendChild(
      h("div",{class:"notice warn"},"First-time owner setup on this device/domain — create the staff owner account (it receives the admin role automatically). Students can NOT self-register anywhere: their accounts live in the school Sheet (Students tab)."),
      err0,
      h("div",{class:"field"},h("label",{},"Owner name"),nI),
      h("div",{class:"field"},h("label",{},"Owner password"),pI2),
      h("button",{class:"btn pri",style:"width:100%",onclick:()=>{const r=register(nI.value,pI2.value);
        if(r.err){err0.textContent=r.err;err0.style.display="block";return;} render();}},"Create owner account"));
  }else{
    const err=h("div",{class:"notice err",style:"display:none"});
    const nameI=h("input",{placeholder:"Owner display name",style:"width:100%"});
    const passI=h("input",{type:"password",placeholder:"Password",style:"width:100%"});
    const go=()=>{const r=login(nameI.value,passI.value);
      if(r.err){err.textContent=r.err;err.style.display="block";return;}
      if(r.ok.role!=="admin"){DB.sessionUserId=null;saveDB();
        err.textContent="Account \""+r.ok.name+"\" does not have the admin role.";
        err.style.display="block";return;}
      render();};
    passI.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
    card.querySelector(".pbody").appendChild(err,
      h("div",{class:"field"},h("label",{},"Display name"),nameI),
      h("div",{class:"field"},h("label",{},"Password"),passI),
      h("button",{class:"btn pri",style:"width:100%",onclick:go},"Authenticate"),
      h("p",{class:"hint",style:"margin-top:12px;text-align:center"},"Owner accounts only — students sign in on the student site with their Sheet name/StudentID + access code."),
      h("div",{style:"text-align:center;margin-top:8px"},h("a",{href:"index.html",style:"font-size:12px"},"← Back to student site")));
  }
  wrap.appendChild(card);app.appendChild(wrap);
}
function syncLed(){
  if(!SYNC.enabled())return h("span",{class:"led warn"},h("i",{}),"SYNC OFF");
  const l=SYNC.last();
  if(!l)return h("span",{class:"led"},h("i",{}),"SYNC IDLE");
  return l.ok?h("span",{class:"led ok"},h("i",{}),"SYNC LIVE"):h("span",{class:"led err"},h("i",{}),"SYNC ERR");
}
function drawShell(app,u){
  const flagged=DB.chapters.reduce((a,c)=>a+((c.validation&&c.validation.flagged)||0),0);
  const q=SYNC.queue().length;
  const shell=h("div",{class:"shell"});
  const nav=h("nav",{},
    ...[["overview","◧","Overview",""],
        ["analytics","📈","Teacher Analytics",""],
        ["content","⛁","Content Pipeline",flagged?"hot":""],
        ["sync","⇄","Sheets Sync",q?"hot":""],
        ["accounts","👥","Accounts",""]].map(([k,ic,lb,hot])=>
      h("button",{class:"nitem"+(tab===k?" on":""),onclick:()=>{tab=k;render();}},
        h("span",{class:"ic"},ic),lb,
        k==="content"&&flagged?h("span",{class:"cnt hot"},flagged):null,
        k==="sync"&&q?h("span",{class:"cnt hot"},q):null)));
  shell.appendChild(h("aside",{},
    h("div",{class:"brand"},
      h("div",{class:"logo"},"漢"),
      h("div",{},h("b",{},"HSK 1 Mission Control"),h("small",{},"staff · v15 curriculum"))),
    nav,
    h("div",{class:"sidefoot"},
      "core rev: "+(DB.schemaVersion||1)+" · bundles: "+CURRICULUM_BUNDLE.length+
      "<br>bank: "+DB.questions.length+" q · "+DB.vocab.length+" w · "+DB.sentences.length+" s"+
      "<br>storage: localStorage (this device)"+
      "<br>sheet: "+(SYNC.enabled()?"linked":"not linked"))));
  const main=h("main",{});
  const titles={overview:["System Overview","state of curriculum, validation & sync"],
    analytics:["Teacher Analytics","cohort + per-student performance"],
    content:["Content Pipeline","import → validate → publish"],
    sync:["Google Sheets Sync","bridge to the lecture-site sheet"],
    accounts:["Accounts & Roles","device-local identities"]};
  main.appendChild(h("div",{class:"topbar"},
    h("div",{},h("div",{class:"crumb"},"admin / "+tab),h("h1",{},titles[tab][0])),
    h("span",{class:"sub",style:"font:11px var(--mono);color:var(--dim)"},titles[tab][1]),
    h("div",{class:"sp"}),
    syncLed(),
    q?h("span",{class:"led warn"},h("i",{}),"QUEUE "+q):null,
    flagged?h("span",{class:"led warn"},h("i",{}),flagged+" FLAGGED"):null,
    h("span",{class:"led"},h("i",{style:"background:var(--cyan)"}),u.name.toUpperCase()),
    h("a",{href:"index.html",class:"btn sm"},"Student site"),
    h("button",{class:"btn sm",onclick:()=>{DB.sessionUserId=null;saveDB();render();}},"Logout")));
  const body=h("div",{class:"fade"});
  main.appendChild(body);shell.appendChild(main);app.appendChild(shell);
  ({overview:drawOverview,analytics:drawAnalytics,content:drawContent,sync:drawSync,accounts:drawAccounts})[tab](body,u);
}
/* ---------------- overview ---------------- */
function drawOverview(body,u){
  const ready=DB.chapters.filter(isReady).length;
  const flagged=DB.chapters.reduce((a,c)=>a+((c.validation&&c.validation.flagged)||0),0);
  const issues=DB.chapters.filter(c=>c.validation&&!c.validation.ok);
  body.appendChild(h("div",{class:"grid g5",style:"margin-bottom:14px"},
    h("div",{class:"kpi",style:"--kc:var(--cyan)"},h("div",{class:"v"},DB.chapters.length),h("div",{class:"l"},"Chapters"),h("div",{class:"d"},ready+" ready · "+(DB.chapters.length-ready)+" other")),
    h("div",{class:"kpi",style:"--kc:var(--cyan)"},h("div",{class:"v"},DB.questions.length),h("div",{class:"l"},"Bank questions"),h("div",{class:"d"},DB.vocab.length+" words · "+DB.sentences.length+" sentences")),
    h("div",{class:"kpi",style:"--kc:"+(flagged?"var(--warn)":"var(--ok)")},h("div",{class:"v"},flagged),h("div",{class:"l"},"Flagged for review"),h("div",{class:"d"},"excluded from practice & exams")),
    h("div",{class:"kpi",style:"--kc:var(--coral)"},h("div",{class:"v"},issues.length),h("div",{class:"l"},"Blocking issues"),h("div",{class:"d"},issues.length?"open Content Pipeline":"all validations passed")),
    h("div",{class:"kpi",style:"--kc:var(--ok)"},h("div",{class:"v"},DB.users.length),h("div",{class:"l"},"Accounts"),h("div",{class:"d"},DB.users.filter(x=>x.role==="admin").length+" admin · "+(SYNC.enabled()?"sheet linked":"local only")))));
  body.appendChild(h("div",{class:"grid g2"},
    h("div",{class:"panel"},h("div",{class:"phead"},h("h3",{},"Curriculum integrity"),h("div",{class:"sp"}),
        h("button",{class:"btn sm",onclick:()=>{tab="content";render();}},"open pipeline")),
      h("div",{class:"pbody"},
        ...DB.chapters.slice().sort((a,b)=>a.num-b.num).map(c=>h("div",{class:"kv"},
          h("span",{class:"k"},"Ch "+c.num+" · "+c.title.slice(0,34)),
          h("span",{},
            h("span",{class:"pill "+(c.status==="ready"?"ok":c.status==="review"?"warn":"mut"),style:"margin-right:6px"},h("i",{}),c.status),
            h("span",{class:"num",style:"color:var(--dim)"},questionsOf(c.id).length+" q")))))),

        const actT=h("table",{class:"tbl"},h("tbody",{},...Object.entries(p.byActivity).map(([t,v])=>h("tr",{},
          h("td",{},(ACT[t]||{n:t}).n),h("td",{class:"num"},v.attempts+" att"),
          h("td",{class:"num"},Math.round(v.correct/v.attempts*100)+"%")))));
        const missEl=Object.keys(p.missed).length
          ?h("table",{class:"tbl"},h("tbody",{},...Object.entries(p.missed).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([qid,n])=>h("tr",{},
              h("td",{class:"mono",style:"font-size:11px"},qid),h("td",{class:"num",style:"color:var(--coral)"},n+"×")))))
          :h("p",{class:"hint"},"Nothing missed yet 🎉");
        const recEl=p.recent.length
          ?h("table",{class:"tbl"},h("tbody",{},...p.recent.slice(0,10).map(r=>h("tr",{},
              h("td",{class:"num",style:"color:"+(r.skipped?"var(--dim)":r.correct?"var(--ok)":"var(--coral)")},r.skipped?"skip":r.correct?"✓":"✗"),
              h("td",{},(ACT[r.type]||{n:r.type}).n),
              h("td",{class:"mono",style:"font-size:10px;color:var(--dim)"},new Date(r.ts).toLocaleString())))))
          :h("p",{class:"hint"},"No activity yet.");
        wrap.appendChild(h("div",{class:"panel",style:"border-color:var(--line2)"},
          h("div",{class:"phead"},h("h3",{},"👤 "+p.name),h("div",{class:"mono",style:"font-size:10.5px;color:var(--dim)"},p.id),h("div",{class:"sp"}),
            h("button",{class:"btn sm",onclick:()=>{sel=null;draw();}},"← all students")),
          h("div",{class:"pbody"},tiles,
            h("div",{class:"grid g2",style:"margin-bottom:12px"},
              h("div",{},h("h4",{class:"mono",style:"font:700 10px var(--mono);letter-spacing:1.4px;color:var(--dim);margin-bottom:8px"},"PER LESSON"),lesT),
              h("div",{},h("h4",{style:"font:700 10px var(--mono);letter-spacing:1.4px;color:var(--dim);margin-bottom:8px"},"PER ACTIVITY"),actT)),
            h("div",{class:"grid g2"},
              h("div",{},h("h4",{style:"font:700 10px var(--mono);letter-spacing:1.4px;color:var(--dim);margin-bottom:8px"},"MOST MISSED"),missEl),
              h("div",{},h("h4",{style:"font:700 10px var(--mono);letter-spacing:1.4px;color:var(--dim);margin-bottom:8px"},"RECENT ACTIVITY"),recEl)))));
      }
    }
    draw();
   }catch(e){
     wrap.innerHTML="";
     wrap.appendChild(h("div",{class:"notice err"},"Teacher dashboard error: "+(e&&e.message?e.message:String(e))+" — copy this message to the developer."));
   }
  })();
}
/* ---------------- sheets sync ---------------- */
function drawSync(body,u){
  const sc=SYNC.cfg();
  const urlI=h("input",{value:sc.url||"",placeholder:"https://script.google.com/macros/s/…/exec",class:"mono",style:"width:100%"});
  const tokI=h("input",{value:sc.token||"",placeholder:"shared secret token",class:"mono",style:"width:100%"});
  const out=h("div",{});
  const st=h("div",{class:"kv",style:"margin-top:12px"},h("span",{class:"k"},"Queue / last push"),
    h("span",{class:"val"},SYNC.queue().length+" msg · "+(SYNC.last()?(SYNC.last().ok?"OK "+(SYNC.last().sent||0)+" rows":"ERR "+(SYNC.last().error||"")):"—")));
  body.appendChild(h("div",{class:"panel"},
    h("div",{class:"phead"},h("h3",{},"Bridge configuration"),h("div",{class:"sp"}),syncLed()),
    h("div",{class:"pbody"},
      h("p",{class:"hint",style:"margin-bottom:12px"},"This build ships with the deployment's bridge credentials BAKED IN (SYNC_DEFAULTS), so every student browser on this domain signs in via the school Sheet with zero setup. Saving here overrides them for THIS browser only; saving empty values disables sync on this device. The bridge lives in a STANDALONE Apps Script project (tools/sheets_bridge.gs) pointing at the lecture-site spreadsheet by id."),
      h("div",{class:"field"},h("label",{},"Web app URL"),urlI),
      h("div",{class:"field"},h("label",{},"Token"),tokI),
      h("div",{style:"display:flex;gap:8px;flex-wrap:wrap"},
        h("button",{class:"btn pri",onclick:()=>{SYNC.save({url:urlI.value.trim(),token:tokI.value.trim()});render();}},"Save"),
        h("button",{class:"btn",onclick:()=>{SYNC.reset();render();}},"Restore build default"),
        h("button",{class:"btn",onclick:async()=>{out.innerHTML="";
          try{const r=await SYNC.ping();
            out.appendChild(h("div",{class:"notice "+(r.ok?"ok":"err"),style:"margin-top:10px"},r.ok?"Connected ✓ tabs: "+(r.tabs||[]).join(", "):"Error: "+r.error));}
          catch(e){out.appendChild(h("div",{class:"notice err",style:"margin-top:10px"},"Unreachable: "+e));}}},"Test connection"),
        h("button",{class:"btn",onclick:async()=>{const r=await SYNC.flush();out.innerHTML="";
          out.appendChild(h("div",{class:"notice "+(r.ok?"ok":"err"),style:"margin-top:10px"},r.ok?"Flushed "+(r.sent||0)+" queued message(s)":"Failed: "+(r.error||r.reason||"unknown")));render();}},"Sync now"),
        h("button",{class:"btn",onclick:async()=>{out.innerHTML="";
          const lessons=DB.chapters.map(c=>({LessonID:"lesson-"+c.num,LessonNum:c.num,Title:c.title,
            WordsCount:vocabOf(c.id).length,SentencesCount:sentencesOf(c.id).length,
            QuestionsCount:questionsOf(c.id).length,Status:c.status}));
          try{const r=await SYNC.post("catalog",{lessons});
            out.appendChild(h("div",{class:"notice "+(r.ok?"ok":"err"),style:"margin-top:10px"},r.ok?"Catalog pushed: "+r.lessons+" lessons":"Error: "+r.error));}
          catch(e){out.appendChild(h("div",{class:"notice err",style:"margin-top:10px"},"Unreachable: "+e));}}},"Push lessons catalog")),
      out,st,
      h("div",{class:"kv"},h("span",{class:"k"},"Config source"),h("span",{class:"val"},SYNC.usingDefault()?"build default (baked in — applies to every browser on this domain)":"saved override on this device only")),
      h("div",{class:"kv"},h("span",{class:"k"},"How it works"),h("span",{class:"val"},"batch every 2s + flush at session end · retry on failure · upserts by key")))));
  if(SYNC.enabled()&&!SYNC.queue().length&&!(SYNC.last()&&SYNC.last().ok))
    body.appendChild(h("div",{class:"notice warn",style:"margin-top:12px"},"Sheet is connected but has received nothing yet. Expected until a student signs in on the STUDENT site with Sheet credentials (name/StudentID + Code, e.g. Ebra + 8520) and answers questions. Local admin accounts are NEVER pushed (no StudentID in the Sheet). Checklist: 1) green chip with stu-XXXX in the student header after login · 2) queue drains to 0 · 3) rows appear in LearningEvents/Sessions."));
  body.appendChild(h("div",{style:"margin-top:12px"},
    h("h4",{style:"font:700 10px var(--mono);letter-spacing:1.4px;color:var(--dim);margin-bottom:8px"},"ACCOUNT LINKAGE ON THIS DEVICE"),
    ...DB.users.map(x=>h("div",{class:"kv"},
      h("span",{class:"k"},x.name+" ("+x.studentId+")"),
      h("span",{class:"val"},x.sheetId?h("span",{class:"pill cy"},"pushed as "+x.sheetId):h("span",{class:"pill mut"},"local only - never pushed"))))));
}
